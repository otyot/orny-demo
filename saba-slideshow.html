  // to shrink everything, up to grow it — this is the one place to tune it.
  const STAGE_WIDTH_FRACTION = 0.62;
  const STAGE_HEIGHT_FRACTION = 0.68;
  // Reading-pair sizing budgets (see buildReadingStage below).
  // MASCOT rounds: each letter's box is computed from its own full-picture
  // crop window and scaled as large as the two STAGE budgets below allow —
  // these are THE size knobs for the mascot pair now. Height runs high on
  // purpose: Noam pointed out the old row sat vertically centered with big
  // empty bands above and below it, and asked for the full pictures to
  // grow into that space (basket extending up, bottle extending down)
  // instead of the characters shrinking to keep the pictures whole.
  const READING_STAGE_WIDTH_FRACTION = 0.92;  // both boxes + gap, of content width
  const READING_STAGE_HEIGHT_FRACTION = 0.88; // tallest box, of content height
  // LETTERS round (text slots) keeps the original compact equal boxes,
  // sized by the two fractions below — glyphs never needed the
  // full-picture budget, and this leaves that round pixel-identical to the
  // previously-approved version. Also the fallback mascot-box size for the
  // brief moment before the windows have been measured (see
  // buildReadingStage).
  const READING_BOX_WIDTH_FRACTION = 0.2;
  const READING_BOX_HEIGHT_FRACTION = 0.32;
  const READING_CHAR_GAP_FRACTION = 0.05; // gap between the two CHARACTERS' facing ink edges, as a fraction of contentEl's width. This replaced the old box-edge gap (READING_GAP_FRACTION): with real asymmetric compositions, box edges said nothing about how far apart the characters LOOKED. This measures the thing Noam actually sees.
  // LETTERS round (real Hebrew glyph PNGs) — same "how much of the screen /
  // how close together" knobs as the mascot ones above, kept as their own
  // constants since the two rounds are visually independent and will very
  // likely want different values. Safe to tune freely; none of these can
  // reintroduce a reveal jump (nothing here depends on which state a slot
  // is in — there's only one state per letter in this round).
  const READING_LETTER_STAGE_WIDTH_FRACTION = 0.45;  // both letters + gap, of content width
  const READING_LETTER_STAGE_HEIGHT_FRACTION = 0.40; // tallest letter, of content height
  const READING_LETTER_GAP_FRACTION = 0.06; // gap between the two letters' facing ink edges (not box edges — same "what the eye sees" idea as READING_CHAR_GAP_FRACTION)
  const READING_SILENT_LETTER_GAP_FRACTION = 0.02; // a silent companion letter (Aleph, He, ...) sits close to its host letter's left side, like normal in-word letter spacing in printed Hebrew — tighter than 0.035 (Noam: move it right, closer in, to about book-like spacing) but not as tight as 0.015 (that read as touching/merged). Originally tuned for Aleph specifically; reused as-is for every chapter's silent companion.
  // Noam overlaid a screenshot of the mascot characters/pictures on top of
  // the letters screen: the letters group sits noticeably right of where
  // the characters actually are, and a bit small. Measured via ink
  // centers (1200-wide reference content box): mascot Sa/Ba ink centers
  // sit at roughly x=686/486, the letters group's centers were sitting at
  // x=729/576 — off by ~45-90px to the right. This shifts the whole group
  // left by a flat fraction of content width to compensate; not derived
  // from any per-letter ink math (deliberately — it's a simple constant
  // nudge, easy to re-tune from a future comparison screenshot).
  const READING_LETTER_GROUP_SHIFT_X_FRACTION = -0.05;
  // Per-pair multiplicative correction on top of the letters round's shared
  // fit-to-budget scale S — see where this is applied (search
  // READING_LETTER_SCALE) for why Ka/Na's own ink proportions make the
  // shared formula pick a bigger S than Sa/Ba's or Pa/Ra's, unprompted.
  // Missing keys default to 1 (no change) — Sa/Ba and Pa/Ra already land in
  // the same ballpark as each other and don't need this.
  const READING_LETTER_SCALE = { 'ka|na': 0.8967 };
  // FINAL SENTENCE ROUND — the last chapter, after Sa/Ba, Ka/Na, and Pa/Ra
  // have each been taught: all 9 real letter glyphs (6 taught + 3 silent
  // companions) laid out in one row as the actual taught sentence
  // "סַבָּא קָנָה פָּרָה" (Saba Kana Para — "Grandfather bought a cow"), read
  // right to left same as every word before it. Same "fit a fixed budget,
  // one shared scale" approach as the letters round above, just generalized
  // from 2-3 glyphs to a 9-glyph chain — see buildSentenceStage. Three gap
  // sizes, not one: a taught letter sits close to its silent companion
  // (tightest), a bit further from its word-partner, and a visibly bigger
  // gap between words themselves (so the eye can tell where one word ends
  // and the next begins) — same "facing ink edges, fixed fraction of screen
  // width" idea as every other gap constant in this file, just three of
  // them chained instead of one.
  const SENTENCE_STAGE_WIDTH_FRACTION = 0.92;  // the whole 9-glyph row, of content width
  const SENTENCE_STAGE_HEIGHT_FRACTION = 0.40; // tallest letter, of content height — same budget as the single-word letters round
  const SENTENCE_LETTER_GAP_FRACTION = READING_LETTER_GAP_FRACTION;      // between a word's own two taught letters
  const SENTENCE_COMPANION_GAP_FRACTION = READING_SILENT_LETTER_GAP_FRACTION; // between a taught letter and its silent companion
  const SENTENCE_WORD_GAP_FRACTION = 0.11;     // between one word and the next — roughly double the intra-word gap, so words read as distinct chunks
  const FALLBACK_DIMS = { w: 4, h: 3 }; // used only until an image's real size is known

  // Fits a box of `dims` aspect ratio inside a fraction of contentEl's box,
  // on BOTH axes at once (unlike CSS aspect-ratio alone, which only fixes
  // one axis and can overflow the other) — this is what guarantees the
  // scene is always "big enough but not too big, with room to spare"
  // regardless of whether an image is tall, wide, or square. Defaults to
  // the solo-stage fractions; pass smaller ones (see PAIR_*_FRACTION above)
  // when the stage has to share the row with another one.
  function applyStageSize(stage, dims, widthFraction, heightFraction) {
    const rect = contentEl.getBoundingClientRect();
    const maxW = rect.width * (widthFraction || STAGE_WIDTH_FRACTION);
    const maxH = rect.height * (heightFraction || STAGE_HEIGHT_FRACTION);
    const scale = Math.min(maxW / dims.w, maxH / dims.h);
    stage.style.width = `${Math.round(dims.w * scale)}px`;
    stage.style.height = `${Math.round(dims.h * scale)}px`;
  }

  // Builds a same-size, same-position stage for ANY canvas-scale image —
  // character alone, plain picture, or a picture/character with one or more
  // transparent element overlays stacked on top at 0,0 so pre-registered
  // PNGs line up automatically. Every frame kind that shows the "scene"
  // (character, picture, elements) goes through this ONE function so the
  // box is always identical — that's what keeps size/position locked
  // across every slide instead of jumping between different sizing rules.
  // `overlaySrcs` is an array (possibly empty) applied in order, so earlier
  // elements stay visible underneath later ones (cumulative, never swapped
  // out). `fadeBase` dims the base image to 50% opacity in code (the
  // re-drill look) without needing a second "-50" asset file.
  // Caches, per image src, the "x% y%" transform-origin that sits at the
  // center of that PNG's actual visible (non-transparent) mark — computed
  // once by scanning pixel alpha via an offscreen canvas. Needed because
  // each element overlay is a mostly-transparent full-canvas PNG, so
  // scaling from the box's geometric center (the default) makes the small
  // visible red mark appear to drift instead of growing in place.
  // `animateSrc` + `animateOrigin`: the ONE overlay src (an element marker,
  // never the character) that should play the pop-in scale for this tap,
  // and the "x% y%" transform-origin to scale it from. The origin is a
  // precomputed constant per element (see each element's `origin` field in
  // LETTERS below) rather than detected at runtime — Chrome blocks reading
  // pixel data back out of a canvas for file:// images (a "tainted canvas"
  // security restriction), so scanning for the visible mark's true center
  // in-browser isn't reliable here. Whenever an element's PNG is replaced,
  // its `origin` should be recomputed (quick to redo, ask and it's a
  // one-line update — no restructuring).
  // `widthFraction`/`heightFraction`: override the default solo-stage sizing
  // budget. (Reading-pair frames no longer go through this function — see
  // buildReadingStage/buildReadingBox, which position their own boxes on a
  // fixed absolute canvas instead — but the override params are left here
  // in case a future solo-stage variant needs a different budget.)
  function buildCompositeStage(baseSrc, overlaySrcs, fadeBase, animateSrc, animateOrigin, widthFraction, heightFraction) {

    applyStageSize(stage, knownDims || FALLBACK_DIMS, widthFraction, heightFraction);
    const base = imgOrPlaceholder(baseSrc);
    if (base.tagName === 'IMG') {
      if (fadeBase) base.classList.add('faded');
      if (!knownDims) {
        base.onload = () => {
          if (base.naturalWidth && base.naturalHeight) {
            const dims = { w: base.naturalWidth, h: base.naturalHeight };
            imageDims.set(baseSrc, dims);
            applyStageSize(stage, dims, widthFraction, heightFraction);
          }
        };
      }
    }
    stage.appendChild(base);
    (overlaySrcs || []).forEach((src) => {
      if (!src) return;
      const overlayImg = imgOrPlaceholder(src);
      if (src === animateSrc && overlayImg.tagName === 'IMG') {
        overlayImg.style.transformOrigin = animateOrigin || '50% 50%';
        overlayImg.classList.add('pop-in');
      }
      stage.appendChild(overlayImg);
    });
    return stage;
  }

  // READING-PAIR LAYOUT — built as a fixed-size absolute-position canvas,
  // not a flexbox row. This directly mirrors how the reference Google
  // Slides deck is actually built: Sa's box, Ba's box, and each arrow are
  // independent objects with their own fixed coordinates, none of them
  // able to push or resize any other (Noam pointed this out directly,
  // looking at the bounding boxes in his own slide — the picture, the
  // character, and the arrow are three separate positioned objects, not one
  // box whose size depends on another). Every earlier "same row" /
  // "grows when the arrow appears" bug came from the flexbox version
  // computing each slot's box FROM its own content and then flowing it next
  // to its neighbor — an absolute canvas removes that mechanism entirely:
  // a box's position/size is set once, geometrically, from constants, and
  // nothing about its content (plain vs composite, active vs not) can ever
  // change it.
  function buildReadingBox(spec, isActive) {
    const box = el('div', 'reading-box');
    // Stacking: composite boxes sit BELOW plain/text boxes. Boxes can
    // overlap now that the characters are pulled close (a composite's full
    // picture may extend behind the neighbour's slot), and this guarantees
    // a 20%-faded picture always passes BEHIND a neighbouring
    // full-opacity character, never tints over it.
    box.style.zIndex = spec.type === 'composite' ? '1' : '2';
    if (spec.type === 'text') {
      const textEl = el('p', 'hebrew-text', spec.text);
      if (isActive) textEl.classList.add('reading-box--pulse');
      box.appendChild(textEl);
      return box;
    }
    if (spec.type === 'letter-image') {

      // file's own canvas (see the LETTER-GLYPH WINDOW comment), so this is
      // just the source PNG directly, sized/positioned by buildReadingStage.
      const L = LETTERS[spec.letter];
      const letterImgEl = document.createElement('img');
      letterImgEl.className = 'reading-box-img';
      letterImgEl.alt = L.letterImg;
      letterImgEl.src = L.letterImg;
      applyLetterPulseOrigin(letterImgEl, spec.letter);
      if (isActive) letterImgEl.classList.add('reading-box--pulse');
      box.appendChild(letterImgEl);
      return box;
    }
    if (spec.type === 'composite') {
      // Two separately stacked images, NOT one flattened picture — the
      // static faded picture underneath, and the character on top of it as
      // its own element, so the pulse (below) can animate the character
      // alone without the picture moving with it. Both are cropped through
      // the IDENTICAL per-letter reading window (see the READING WINDOW
      // comment above computeInkBBoxPixels) so they stay pixel-registered
      // exactly as if they were still one flattened image — and since the
      // plain-alone state uses that same window too, the character overlay
      // here is the very same cached crop the plain state shows: only the
      // faded picture underneath it is new.
      const baseImg = document.createElement('img');
      baseImg.className = 'reading-box-img faded';
      baseImg.alt = spec.base;
      const overlayImg = document.createElement('img');
      overlayImg.className = 'reading-box-img';
      overlayImg.alt = spec.overlay;
      applyCharPulseOrigin(overlayImg, spec.letter);
      if (isActive) overlayImg.classList.add('reading-box--pulse');
      box.appendChild(baseImg);
      box.appendChild(overlayImg);
      applyReadingCrop(baseImg, spec, spec.base);
      applyReadingCrop(overlayImg, spec, spec.overlay);
      return box;
    }
    // Plain-mascot-alone: cropped through the same per-letter reading
    // window the composite uses — identical pixels in both states, which
    // is exactly what makes the picture-reveal jump impossible. Pair
    // consistency between Sa and Ba comes from buildReadingStage sizing
    // each letter's box off its own window at one shared display scale.
    const charImg = document.createElement('img');
    charImg.className = 'reading-box-img';
    charImg.alt = spec.src;
    applyCharPulseOrigin(charImg, spec.letter);
    if (isActive) charImg.classList.add('reading-box--pulse');
    box.appendChild(charImg);
    applyReadingCrop(charImg, spec, spec.src);
    return box;
  }
  // Places an already-built box at fixed pixel coordinates within the
  // reading-stage — geometry only, completely independent of what's inside.
  function positionAbsolute(node, left, top, width, height) {

    node.style.left = `${Math.round(left)}px`;
    node.style.top = `${Math.round(top)}px`;
    if (width != null) node.style.width = `${Math.round(width)}px`;
    if (height != null) node.style.height = `${Math.round(height)}px`;
  }
  // Builds the whole reading-pair frame as one fixed canvas: Sa's box on the
  // right, Ba's box on the left (RTL, per Hebrew reading order) — every
  // coordinate computed once from contentEl's size and fixed constants,
  // never from any box's content.
  //
  // ATTENTION CUE: an experiment, replacing the arrow entirely. Every
  // attempt to fix a residual glitch on the arrow appearing/disappearing
  // came up short — confirmed one real bug (a composite's image sat
  // genuinely blank for a beat the first time it was shown) and fixed it,
  // but couldn't rule out something below what this deck's own tools can
  // observe. Rather than keep guessing at the arrow's timing, the active
  // side now pulses in place (twice) instead — same content, same box,
  // same position, no separate element being added/removed/repositioned at
  // all. If this still shows any hint of a glitch, that tells us clearly
  // it was never about the arrow specifically — it's the plain-to-composite
  // content swap itself. If it's smooth, we have a working version.
  function buildReadingStage(saSpec, baSpec, active) {
    const stage = el('div', 'reading-stage');
    const rect = contentEl.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    stage.style.width = `${Math.round(rect.width)}px`;
    stage.style.height = `${Math.round(rect.height)}px`;

    // CHARACTER-ANCHORED PLACEMENT. The letters round (text slots) keeps
    // the original compact equal centered boxes. Mascot rounds place each
    // letter's box FROM the measured position of its character within its
    // (full-canvas) window, so that on screen:
    //
    //   1. both characters' ink renders at the same size — one shared
    //      scale K (screen px per source-ink px) for both letters,
    //   2. both characters' ink centers sit on the same horizontal line,
    //   3. the gap between Ba's right ink edge and Sa's left ink edge is
    //      exactly READING_CHAR_GAP_FRACTION of the screen width — the
    //      distance the eye actually reads as "how far apart they are",
    //   4. the union of the two boxes is centered on screen, and K is the
    //      largest value keeping that union inside the width/height
    //      budgets.
    //
    // Everything is computed from per-letter measurements and constants —
    // never from which state (plain/composite) a slot is in this frame —
    // so no box can move or resize across a picture-reveal tap (that would
    // be the size-jump bug again). Boxes MAY overlap (a full picture can
    // extend behind the neighbour's character); see the z-index note in
    // buildReadingBox for why that renders correctly.
    const isTextFrame = saSpec.type === 'text' || baSpec.type === 'text';
    const isLetterFrame = saSpec.type === 'letter-image' || baSpec.type === 'letter-image';
    const fallbackSize = Math.min(rect.width * READING_BOX_WIDTH_FRACTION, rect.height * READING_BOX_HEIGHT_FRACTION);
    // Default layout — used verbatim by the letters round, and as the
    // pre-measurement fallback for mascot frames: the exact geometry the
    // previously-approved version rendered (equal compact boxes, 0.025
    // box-edge gap, centered).
    const defaultGap = rect.width * 0.025;
    let saSize = fallbackSize, baSize = fallbackSize;
    let saLeft = centerX + defaultGap / 2;
    let baLeft = centerX - defaultGap / 2 - fallbackSize;
    let saTop = centerY - fallbackSize / 2, baTop = centerY - fallbackSize / 2;
    // A silent companion letter (Aleph for chapter 1's Ba, He for chapter

    // frames whose left-slot letter actually has one (see isLetterFrame
    // branch below) — starts hidden/zero-sized, never shown unless real
    // geometry is computed for it.
    let companionLeft = 0, companionTop = 0, companionSize = 0, showCompanion = false;
    const companionId = LETTERS[baSpec.letter] && LETTERS[baSpec.letter].silentCompanion;
    // Generic over any two letters (not just literally 'sa'/'ba') — reads
    // whichever letter ids are actually in the two slots this call was
    // given, so the exact same function/math serves chapter 1 and every
    // chapter after it.
    const mSa = readingMetrics(saSpec.letter);
    const mBa = readingMetrics(baSpec.letter);
    const lSa = letterMetrics(saSpec.letter);
    const lBa = letterMetrics(baSpec.letter);
    const lCompanion = companionId ? letterMetrics(companionId) : null;
    if (!isTextFrame && !isLetterFrame && mSa && mBa) {
      // Per-K scale factors (s_L = K * sPerK_L): equal on-screen ink for
      // both letters, with the optional per-letter hand nudge folded in.
      const sSaPerK = (READING_CHAR_SCALE[saSpec.letter] || 1) / mSa.ink;
      const sBaPerK = (READING_CHAR_SCALE[baSpec.letter] || 1) / mBa.ink;
      const pairKey = `${saSpec.letter}|${baSpec.letter}`;
      const gapPx = rect.width * (READING_CHAR_GAP_FRACTION + (READING_CHAR_GAP_EXTRA[pairKey] || 0));
      const widthBudget = rect.width * READING_STAGE_WIDTH_FRACTION;
      const heightBudget = rect.height * READING_STAGE_HEIGHT_FRACTION;

      // Height bound: characters share a baseline, so the union's height
      // is (largest rise above the baseline) + (largest drop below it).
      const upPerK = Math.max(mSa.cy * sSaPerK, mBa.cy * sBaPerK);
      const downPerK = Math.max((mSa.size - mSa.cy) * sSaPerK, (mBa.size - mBa.cy) * sBaPerK);
      let K = heightBudget / (upPerK + downPerK);

      // Width bound (exact): with Ba's box tentatively at x = 0, every box
      // edge is (a * K + g) with g ∈ {0, gapPx}; the union's width is the
      // max over (rightEdge - leftEdge) pairs, so bounding every pair
      // bounds the union.
      const saLeftA = mBa.right * sBaPerK - mSa.left * sSaPerK; // sa box left = saLeftA*K + gapPx
      const edgesRight = [
        { a: mBa.size * sBaPerK, g: 0 },            // ba box right
        { a: saLeftA + mSa.size * sSaPerK, g: gapPx }, // sa box right
      ];
      const edgesLeft = [
        { a: 0, g: 0 },              // ba box left
        { a: saLeftA, g: gapPx },    // sa box left
      ];
      edgesRight.forEach((r) => edgesLeft.forEach((l) => {
        const a = r.a - l.a;
        const g = r.g - l.g;
        if (a > 0 && widthBudget - g > 0) K = Math.min(K, (widthBudget - g) / a);
      }));
      if (!(K > 0)) K = 1; // degenerate screens only — never negative/NaN

      const sSa = K * sSaPerK;
      const sBa = K * sBaPerK;
      saSize = mSa.size * sSa;
      baSize = mBa.size * sBa;

      // Horizontal: Ba at 0, Sa placed so the char-edge gap is exact, then
      // shift both so the union of the boxes is centered on screen.
      baLeft = 0;
      saLeft = mBa.right * sBa + gapPx - mSa.left * sSa;
      const unionLeft = Math.min(baLeft, saLeft);
      const unionRight = Math.max(baLeft + baSize, saLeft + saSize);
      const shiftX = (rect.width - (unionRight - unionLeft)) / 2 - unionLeft + rect.width * (READING_CHAR_CENTER_SHIFT[pairKey] || 0);
      baLeft += shiftX;
      saLeft += shiftX;

      // Vertical: characters share baseline y0; the union of the boxes is
      // centered, so the pictures grow into the free space above/below by
      // however far each composition actually reaches.
      const up = Math.max(mSa.cy * sSa, mBa.cy * sBa);
      const down = Math.max((mSa.size - mSa.cy) * sSa, (mBa.size - mBa.cy) * sBa);
      const y0 = (rect.height - (up + down)) / 2 + up + rect.height * (READING_CHAR_VERTICAL_SHIFT[pairKey] || 0);
      saTop = y0 - mSa.cy * sSa;
      baTop = y0 - mBa.cy * sBa;
    } else if (!isTextFrame && !isLetterFrame) {
      // Metrics not measured yet — realistically only reachable in the
      // first moments after page load, since precomputeReadingPairAssets
      // warms them at boot and the reading phase is many taps in. Render
      // at the fallback layout now, and re-render this same frame once the
      // measurements land (no-op if the person has already moved on).
      // One retry only — see readingRetriedFrames above.
      if (!readingRetriedFrames.has(frames[index].id)) {
        readingRetriedFrames.add(frames[index].id);
        const at = index;
        Promise.all([getReadingWindow(saSpec.letter), getReadingWindow(baSpec.letter)]).then(() => {
          if (index === at && frames[index] && frames[index].kind === 'reading-pair') {
            renderFrame(frames[index]);
          }
        });
      }
    } else if (isLetterFrame && lSa && lBa && (!companionId || lCompanion)) {
      // Letters round: an entirely separate layout from the mascot math
      // above (own font/size/position decisions, per Noam). The shared
      // reference point is NOT the ink center (as with the mascots) but
      // the ink BOTTOM edge — Noam's own design: "my point of reference
      // is the Kamatz sign, so that will be the zero." Both taught letter
      // PNGs, plus the silent companion when this pair has one (Aleph for
      // Sa/Ba, He for Ka/Na — see companionId above), were authored at
      // the same physical canvas size in one Photoshop document, so —
      // unlike the mascots — there's no per-letter ink normalization
      // step: all of them are simply scaled by one shared factor S.
      //
      // Screen order, left to right, is [companion], Ba, [gap], Sa —
      // matching the right-to-left reading order Sa -> Ba(+silent
      // companion). The companion sits right up against Ba
      // (READING_SILENT_LETTER_GAP_FRACTION, much tighter than the Sa/Ba
      // gap) since the two are one visual unit; the Sa/Ba gap stays
      // exactly as tuned before any companion existed.
      const pairKey = `${saSpec.letter}|${baSpec.letter}`;
      const gapPx = rect.width * READING_LETTER_GAP_FRACTION;
      const companionGapPx = rect.width * READING_SILENT_LETTER_GAP_FRACTION;
      const widthBudget = rect.width * READING_LETTER_STAGE_WIDTH_FRACTION;
      const heightBudget = rect.height * READING_LETTER_STAGE_HEIGHT_FRACTION;

      // Height bound: Sa/Ba's ink bottoms share the kamatz baseline, so
      // the union's height is (largest rise above it) + (largest drop
      // below it). The silent companion (if any) is deliberately left out
      // of this — see the vertical-placement note below for why it
      // doesn't use this baseline at all.
      const upPerS = Math.max(lSa.bottom - lSa.top, lBa.bottom - lBa.top);
      const downPerS = Math.max(lSa.size - lSa.bottom, lBa.size - lBa.bottom);
      let S = heightBudget / (upPerS + downPerS);

      // Width bound (exact): same edge-pair approach as the mascot
      // version. Ba's box is tentatively at x = 0; Sa is placed to its
      // right (gapPx), and — only when this pair actually has a silent
      // companion — it's placed to Ba's left (companionGapPx,
      // negative-direction) and folded into the same edge-pair bounding,
      // extended from two boxes to three. The union's width is the max
      // over any (rightEdge - leftEdge) pair, so bounding every pair
      // bounds the union either way.
      const saLeftA = lBa.right - lSa.left; // sa box left = saLeftA*S + gapPx
      const edgesRight = [
        { a: lBa.size, g: 0 },                          // ba box right
        { a: saLeftA + lSa.size, g: gapPx },             // sa box right
      ];
      const edgesLeft = [
        { a: 0, g: 0 },                    // ba box left
        { a: saLeftA, g: gapPx },          // sa box left
      ];
      let companionLeftA = 0;
      if (companionId && lCompanion) {
        companionLeftA = lBa.left - lCompanion.right; // companion box left = companionLeftA*S - companionGapPx
        edgesRight.push({ a: companionLeftA + lCompanion.size, g: -companionGapPx }); // companion box right
        edgesLeft.push({ a: companionLeftA, g: -companionGapPx });                    // companion box left
      }
      edgesRight.forEach((r) => edgesLeft.forEach((l) => {
        const a = r.a - l.a;
        const g = r.g - l.g;
        if (a > 0 && widthBudget - g > 0) S = Math.min(S, (widthBudget - g) / a);
      }));
      if (!(S > 0)) S = 1; // degenerate screens only — never negative/NaN
      // Ka/Na's own ink (Nun's vowel mark sits narrow and close-in) leaves
      // more spare width than Sa/Ba's or Pa/Ra's letters do at the same
      // gap/budget, so the shared width-bound formula above naturally lets
      // Ka/Na's S grow larger — same box-fitting math, just fed a narrower
      // union, producing a visibly bigger word (measured ~309px box vs.
      // Sa/Ba's ~268px and Pa/Ra's ~287px). Noam: "For some reason, Kana is
      // bigger than the other two... please match Kana back to the size of
      // the other two." One multiplicative correction, applied after S is
      // otherwise finalized so every downstream measurement (box sizes,
      // companion size, centering) stays internally consistent — brings
      // Ka/Na's box down to ~277px, the midpoint of the other two.
      S *= (READING_LETTER_SCALE[pairKey] || 1);

      saSize = lSa.size * S;
      baSize = lBa.size * S;

      // Horizontal: Ba at 0, Sa (and the companion, if any) placed so
      // their ink-edge gaps are exact, then shift everything so the union
      // is centered on screen.
      baLeft = 0;
      saLeft = lBa.right * S + gapPx - lSa.left * S;
      if (companionId && lCompanion) {
        companionSize = lCompanion.size * S;
        companionLeft = companionLeftA * S - companionGapPx;
        showCompanion = true;
      }
      const unionLeft = Math.min(baLeft, saLeft, showCompanion ? companionLeft : Infinity);
      const unionRight = Math.max(baLeft + baSize, saLeft + saSize, showCompanion ? companionLeft + companionSize : -Infinity);
      const shiftX = (rect.width - (unionRight - unionLeft)) / 2 - unionLeft + rect.width * READING_LETTER_GROUP_SHIFT_X_FRACTION;
      baLeft += shiftX;
      saLeft += shiftX;

      const down = downPerS * S;

      saTop = y0 - lSa.bottom * S;
      baTop = y0 - lBa.bottom * S;

      // draws every glyph against. That means no ink-derived vertical
      // adjustment is needed at all here: the companion's canvas simply
      // shares Ba's canvas origin (the letter it stands beside), scaled

      if (!readingRetriedFrames.has(frames[index].id)) {

          }
        });
      }
    }

    const saBox = buildReadingBox(saSpec, active === saSpec.letter);
    positionAbsolute(saBox, saLeft, saTop, saSize, saSize);

    const baBox = buildReadingBox(baSpec, active === baSpec.letter);
    positionAbsolute(baBox, baLeft, baTop, baSize, baSize);

    stage.appendChild(saBox);
    stage.appendChild(baBox);

    if (showCompanion) {
      // The silent companion letter (Aleph, He, ...) — not a taught
      // letter, never active/tappable, no pulse — just a fixed companion
      // glyph that belongs next to Ba's letter in the word's real
      // spelling. See LETTERS[x].silentCompanion.
      const companionImg = LETTERS[companionId].letterImg;
      const companionBox = el('div', 'reading-box');
      const companionImgEl = document.createElement('img');
      companionImgEl.className = 'reading-box-img';
      companionImgEl.alt = companionImg;
      companionImgEl.src = companionImg;
      companionBox.appendChild(companionImgEl);
      positionAbsolute(companionBox, companionLeft, companionTop, companionSize, companionSize);
      stage.appendChild(companionBox);
    }

    return stage;
  }

  // FINAL SENTENCE ROUND — one row of all 9 real letter glyphs (6 taught +
  // 3 silent companions) spelling out "סַבָּא קָנָה פָּרָה", right to left:
  //   [He] Ra  Pa    [He] Na  Ka    [Aleph] Ba  Sa
  //   \_ Para word _/  \_ Kana word _/  \___ Saba word ___/
  // (screen left to right; Hebrew is read right to left, so Saba — spoken
  // first — sits on the right, same as every reading-pair round before it.)
  //
  // Geometry follows the exact same "fixed-budget, one shared scale, exact
  // ink-edge gaps" approach as buildReadingStage's letters round just above
  // — the only real difference is a straight left-to-right chain (9 links)
  // instead of that round's 2-or-3-box case, and three different gap sizes
  // instead of one (see the SENTENCE_*_GAP_FRACTION comment above). Once
  // built, the geometry never changes across a tap — same invariant as
  // everywhere else in this deck — only which single taught letter carries
  // .reading-box--pulse changes, exactly mirroring how the reading-pair
  // round cues attention without an arrow.
  const SENTENCE_LAYOUT = [
    // { id, taught, gapBefore } — gapBefore is the gap between this glyph
    // and the previous one in the chain; null for the first glyph.
    { id: 'he', taught: false, gapBefore: null },        // Para's companion
    { id: 'ra', taught: true, gapBefore: 'companion' },
    { id: 'pa', taught: true, gapBefore: 'letter' },
    { id: 'he', taught: false, gapBefore: 'word' },       // Kana's companion
    { id: 'na', taught: true, gapBefore: 'companion' },
    { id: 'ka', taught: true, gapBefore: 'letter' },
    { id: 'aleph', taught: false, gapBefore: 'word' },    // Saba's companion
    { id: 'ba', taught: true, gapBefore: 'companion' },
    { id: 'sa', taught: true, gapBefore: 'letter' },
  ];
  const SENTENCE_GAP_FRACTIONS = {
    companion: SENTENCE_COMPANION_GAP_FRACTION,
    letter: SENTENCE_LETTER_GAP_FRACTION,
    word: SENTENCE_WORD_GAP_FRACTION,
  };
  function buildSentenceStage(frame) {
    const stage = el('div', 'reading-stage');
    const rect = contentEl.getBoundingClientRect();
    stage.style.width = `${Math.round(rect.width)}px`;
    stage.style.height = `${Math.round(rect.height)}px`;

    const metrics = SENTENCE_LAYOUT.map((item) => letterMetrics(item.id));
    if (metrics.some((m) => !m)) {
      // Same one-retry-then-re-render pattern as every other reading stage
      // above — realistically only reachable in the first instants after
      // page load, since precomputeReadingPairAssets warms every one of
      // these nine letters at boot.
      if (!readingRetriedFrames.has(frame.id)) {
        readingRetriedFrames.add(frame.id);
        const at = frames.indexOf(frame);
        Promise.all(SENTENCE_LAYOUT.map((item) => getLetterWindow(item.id))).then(() => {
          if (index === at) renderFrame(frame);
        });
      }
      return stage;
    }

    // Height bound: shared baseline (every taught letter's ink BOTTOM —
    // same kamatz-is-zero convention as the letters round), so the row's
    // height is (tallest rise above it) + (deepest drop below it), taught
    // letters only — silent companions carry no baseline term, same reason
    // as the letters round above (they simply inherit their host's canvas
    // origin, see the companionTop assignment below).
    let up = 0, down = 0;
    SENTENCE_LAYOUT.forEach((item, i) => {
      if (!item.taught) return;
      const m = metrics[i];
      up = Math.max(up, m.bottom - m.top);
      down = Math.max(down, m.size - m.bottom);
    });
    const heightBudget = rect.height * SENTENCE_STAGE_HEIGHT_FRACTION;
    const S_height = heightBudget / (up + down);

    // Width bound: a straight left-to-right chain (unlike the letters
    // round's 2-3-box min-over-edge-pairs — with nine glyphs strictly
    // ordered and never reordered, the tight union width is just the
    // accumulated ink widths plus the accumulated gaps between them, no
    // search needed). widthBudget = ink*S + gaps(px, independent of S), so
    // S is bounded by whatever's left after the fixed-pixel gaps.
    const sumInkWidth = metrics.reduce((sum, m) => sum + (m.right - m.left), 0);
    const sumGapFraction = SENTENCE_LAYOUT.reduce((sum, item) => sum + (item.gapBefore ? SENTENCE_GAP_FRACTIONS[item.gapBefore] : 0), 0);
    const widthBudgetFraction = SENTENCE_STAGE_WIDTH_FRACTION - sumGapFraction;
    const S_width = (rect.width * widthBudgetFraction) / sumInkWidth;

    let S = Math.min(S_height, S_width);
    if (!(S > 0)) S = 1; // degenerate screens only — never negative/NaN

    // Horizontal placement: walk the chain left to right, anchoring each
    // glyph's ink-left edge exactly one gap past the previous glyph's
    // ink-right edge (the same "facing ink edges, fixed px apart"
    // guarantee as every other gap constant in this file), then shift the
    // whole row so its union is centered on screen.
    const lefts = [];
    let cursorInkRight = null; // previous glyph's ink-right edge, in screen px (pre-shift)
    SENTENCE_LAYOUT.forEach((item, i) => {
      const m = metrics[i];
      let left;
      if (cursorInkRight === null) {
        left = -m.left * S; // first glyph: pin its own ink-left to x = 0
      } else {
        const gapPx = rect.width * SENTENCE_GAP_FRACTIONS[item.gapBefore];
        left = cursorInkRight + gapPx - m.left * S;
      }
      lefts.push(left);
      cursorInkRight = left + m.right * S;
    });
    const size = 700 * S; // every glyph shares the same 700x700 canvas
    const unionLeft = Math.min(...lefts);
    const unionRight = Math.max(...lefts.map((l) => l + size));
    const shiftX = (rect.width - (unionRight - unionLeft)) / 2 - unionLeft;

    // Vertical placement: taught letters share baseline y0 (ink bottom);
    // each silent companion simply inherits its host's own top — same
    // canvas-origin-sharing rule as the letters round (see the
    // companionTop comment up in buildReadingStage). "Host" is always the
    // very next glyph in the chain (a companion always immediately
    // precedes the taught letter it belongs to — see SENTENCE_LAYOUT).
    const y0 = (rect.height - (up + down) * S) / 2 + up * S;
    const tops = SENTENCE_LAYOUT.map((item, i) => {
      if (item.taught) return y0 - metrics[i].bottom * S;
      return null; // filled in from the host below, once hosts are known
    });
    SENTENCE_LAYOUT.forEach((item, i) => {
      if (!item.taught) tops[i] = tops[i + 1]; // companion's host is always next in the chain
    });

    SENTENCE_LAYOUT.forEach((item, i) => {
      const box = el('div', 'reading-box');
      const img = document.createElement('img');
      img.className = 'reading-box-img';
      img.alt = LETTERS[item.id].letterImg;
      img.src = LETTERS[item.id].letterImg;
      if (item.taught) {
        applyLetterPulseOrigin(img, item.id);
        if (frame.active === item.id) img.classList.add('reading-box--pulse');
      }
      box.appendChild(img);
      positionAbsolute(box, lefts[i] + shiftX, tops[i], size, size);
      stage.appendChild(box);
    });

    return stage;
  }

  // Final celebration after the full sentence is read — structurally the
  // same "video + sound + confetti, no letters behind it" payoff as every
  // chapter's word-reveal, just without a reading-stage behind the clip
  // (there's no single word here, the sentence itself was the content, on
  // the frames right before this one). If frame.video 404s (Noam's own
  // note: he's producing this clip separately, may not exist in assets/
  // yet), the video element's own 'error' listener below still fires
  // confetti/already-played sound — the celebration never silently no-ops
  // just because the clip isn't dropped in yet.
  function buildFinalRevealStage(frame) {
    const stage = el('div', 'reading-stage');
    const rect = contentEl.getBoundingClientRect();
    stage.style.width = `${Math.round(rect.width)}px`;
    stage.style.height = `${Math.round(rect.height)}px`;
    if (frame.video) {
      const videoEl = document.createElement('video');
      videoEl.className = 'saba-reveal-video';
      videoEl.src = frame.video;
      videoEl.autoplay = true;
      videoEl.muted = true;
      videoEl.playsInline = true;
      videoEl.loop = false;
      videoEl.preload = 'auto';
      videoEl.style.objectPosition = frame.videoPosition || '50% center';
      stage.appendChild(videoEl);
      const CONFETTI_TRIGGER_TIME = (typeof frame.confettiAt === 'number') ? frame.confettiAt : 1.0;
      let confettiFired = false;
      const fireConfetti = () => {
        if (confettiFired) return;
        confettiFired = true;
        const contentRect = contentEl.getBoundingClientRect();
        burstConfetti(contentRect.left + contentRect.width / 2, contentRect.top + contentRect.height / 2);
      };
      videoEl.addEventListener('timeupdate', () => {
        if (videoEl.currentTime >= CONFETTI_TRIGGER_TIME) fireConfetti();
      });
      videoEl.addEventListener('ended', fireConfetti);
      videoEl.addEventListener('error', fireConfetti);
    }
    if (frame.sound) {
      const soundEl = new Audio(frame.sound);
      soundEl.loop = false;
      const playPromise = soundEl.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }
    }
    return stage;
  }

  // Saba reveal: reuses buildReadingStage verbatim for the word (identical
  // geometry to reading-letters-combine — no jump on this tap), then layers
  // Granddad's clip in behind it. Video goes in as the stage's FIRST child
  // via insertBefore, so normal paint order puts it under the already-
  // appended letter boxes — Noam explicitly okayed the word sitting in
  // front of/overlapping the animation. Autoplay muted, no loop: Granddad
  // walks in, waves, and holds on his last frame ("just a cycle once and
  // stops," not a loop).
  function buildSabaRevealStage(frame) {
    const stage = buildReadingStage(frame.sa, frame.ba, null);
    if (frame.video) {
      const videoEl = document.createElement('video');
      videoEl.className = 'saba-reveal-video';
      videoEl.src = frame.video;
      videoEl.autoplay = true;
      videoEl.muted = true;
      videoEl.playsInline = true;
      videoEl.loop = false;
      videoEl.preload = 'auto';
      // Where object-fit:contain centers the video within any leftover
      // letterbox gutter — only matters when the clip's own aspect ratio
      // doesn't match the stage's, so this is a no-op (stays dead center)
      // for any clip that doesn't set one, Saba's included.
      videoEl.style.objectPosition = frame.videoPosition || '50% center';
      stage.insertBefore(videoEl, stage.firstChild);
      // Confetti timing — measured directly from each clip's own frames
      // (see the comment at each frame's confettiAt value in buildDeck),
      // since different reveal clips settle at different times. Falls back
      // to Saba's original 3.6s (his arm-lift point in
      // saba-wave-compressed.mp4, 5.6s total) if a frame doesn't specify
      // one, so this stays byte-for-byte unchanged for chapter 1. Origin is
      // #content's own live-measured center (same rect buildReadingStage
      // uses), which sits right on the word/character group — not the left
      // edge anyone walked in from, and not tied to a moving element's
      // start point.
      const CONFETTI_TRIGGER_TIME = (typeof frame.confettiAt === 'number') ? frame.confettiAt : 3.6;
      let confettiFired = false;
      const fireConfetti = () => {
        if (confettiFired) return;
        confettiFired = true;
        const contentRect = contentEl.getBoundingClientRect();
        burstConfetti(contentRect.left + contentRect.width / 2, contentRect.top + contentRect.height / 2);
      };
      videoEl.addEventListener('timeupdate', () => {
        if (videoEl.currentTime >= CONFETTI_TRIGGER_TIME) fireConfetti();
      });
      // Safety net, not the primary trigger: guarantees the celebration
      // still happens even if 'timeupdate' is ever skipped, or the clip
      // fails to play at all — a broken/short clip shouldn't silently
      // cancel the payoff. confettiFired guards against firing twice.
      videoEl.addEventListener('ended', fireConfetti);
      videoEl.addEventListener('error', fireConfetti);
    }
    if (frame.sound) {
      // "Level complete" sting — plays once, immediately, the instant this
      // slide is built (not muted: getting here is a real tap/user
      // gesture, so browsers allow autoplay with sound here, unlike the
      // video above). Not attached to the DOM at all — it doesn't need to
      // be seen, just heard, and this keeps it out of the stage's paint
      // order entirely.
      const soundEl = new Audio(frame.sound);
      soundEl.loop = false;
      const playPromise = soundEl.play();
      // Real browsers always return a Promise here; guarded defensively
      // since not every environment does (jsdom's play() returns
      // undefined) — ignore autoplay-policy rejections either way.
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }
    }
    return stage;
  }

  // Shared by every buildCompositeStage-based frame kind below (solo-
  // character, picture-reveal, anchor, blank, recall-prompt, recall-answer)
  // — see the STORY_LOOP_CENTER_SHIFT comment above for why this MUST be
  // applied identically to all of a letter's frames, never to a subset.
  // frame.id always starts with the letter id by convention
  // (buildCycleFrames/buildHidingRecall: `${id}-character`, `${id}-picture`,
  // `${id}-anchor-*`, etc.), so this needs no per-frame-kind branching —
  // one lookup covers every frame this letter will ever produce.
  function applyStoryLoopCenterShift(stage, frame) {
    const letterId = frame.id.split('-')[0];
    const shift = STORY_LOOP_CENTER_SHIFT[letterId];
    if (shift) stage.style.transform = `translateX(${shift * 100}%)`;
  }

  function renderFrame(frame) {
    contentEl.innerHTML = '';

    switch (frame.kind) {
      // NOTE: no on-screen text for the teaching-cycle frames below — Noam
      // narrates live and the caption strip (subtitle-style) carries the
      // words. frame.text is kept on the data for reference/Pass-2 use, it's
      // just not rendered here. ('Yay!' and the word-reveal are content in
      // their own right, not narration, so those still render text.)
      // solo-character / picture-reveal / anchor / blank / recall-prompt /
      // recall-answer ALL go through the same buildCompositeStage box, so
      // size and position never jump between them.
      case 'solo-character':
      case 'recall-prompt': {
        const stage = buildCompositeStage(frame.img, [], frame.fade);
        applyStoryLoopCenterShift(stage, frame);
        contentEl.appendChild(stage);
        break;
      }
      case 'picture-reveal':
      case 'recall-answer': {
        const stage = buildCompositeStage(frame.img, []);
        applyStoryLoopCenterShift(stage, frame);
        contentEl.appendChild(stage);
        break;
      }
      case 'anchor':
      case 'blank': {
        const stage = buildCompositeStage(frame.imgs[0], frame.imgs.slice(1), frame.fadeBase, frame.animateSrc, frame.animateOrigin);
        applyStoryLoopCenterShift(stage, frame);
        contentEl.appendChild(stage);
        break;
      }
      case 'yay': {
        // Plain blank screen + "Yay!" — no mascot/confetti/decoration in Pass 1.
        // Pass 2 attaches celebration effects to this same frame kind.
        contentEl.appendChild(el('p', 'big-text', frame.text));
        break;
      }
      case 'reading-pair': {
        // No on-screen text here either — same narration-lives-live rule as
        // the teaching-cycle frames above. frame.text is reference-only.
        contentEl.appendChild(buildReadingStage(frame.sa, frame.ba, frame.active));
        break;
      }
      case 'word-reveal': {
        // Content in its own right (like 'yay'), not narration — the word
        // itself renders, via the same letter-image stage as the reading
        // round, with a clip layered in behind it. Generic across
        // chapters — buildSabaRevealStage's name predates chapter 2, but
        // the function itself only ever reads frame.sa/ba/video/sound, so
        // it's reused verbatim for Kana (and every chapter after it).
        contentEl.appendChild(buildSabaRevealStage(frame));
        break;
      }
      case 'sentence-reading': {
        // Final capstone round — the full taught sentence, one letter
        // pulsing per tap. Same narration-lives-live rule as reading-pair
        // above; frame.text is reference-only.
        contentEl.appendChild(buildSentenceStage(frame));
        break;
      }
      case 'sentence-reveal': {
        contentEl.appendChild(buildFinalRevealStage(frame));
        break;
      }
      default: {
        contentEl.appendChild(el('p', 'sub-text', `[unknown frame kind: ${frame.kind}]`));
      }
    }

    captionEl.textContent = CAPTIONS[frame.id] || '';
    hudEl.textContent = `${index + 1} / ${frames.length}`;
    frameIdEl.textContent = frame.id;

    if (frame.moment && MOMENTS[frame.moment]) {
      MOMENTS[frame.moment](frame.momentArg !== undefined ? frame.momentArg : frame);
    }
  }

  function goTo(i) {
    index = Math.max(0, Math.min(frames.length - 1, i));
    renderFrame(frames[index]);
  }
  function next() { goTo(index + 1); }
  function prev() { goTo(index - 1); }

  // Expose for Pass 2 / debugging
  window.SabaDeck = { frames, goTo, next, prev, get index() { return index; } };

  // --- Navigation wiring ---
  document.getElementById('stage').addEventListener('click', (e) => {
    if (e.target.closest('#back-btn')) return;
    next();
  });
  document.getElementById('back-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    prev();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { goTo(0); }
    else if (e.key.toLowerCase() === 'i') { frameIdEl.classList.toggle('show'); }
  });
  // Re-render on resize/orientation change so the stage box is re-fit to
  // the new screen size (e.g. rotating an iPad mid-lesson).
  window.addEventListener('resize', () => renderFrame(frames[index]));

  // Boot
  goTo(0);
</script>
</body>
</html>
