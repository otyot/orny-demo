<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Saba Teaching Slideshow</title>
<style>
  :root {
    --caption-h: 56px;
    --ink: #1c1c1e;
    --paper: #ffffff;
    --muted: #8a8a8e;
    --line: #e2e2e5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper); color: var(--ink);
    touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
  }
  #content {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    padding: 32px 24px;
    text-align: center;
    overflow: hidden;
  }
  .big-text {
    font-size: clamp(32px, 7vw, 72px);
    font-weight: 800;
    line-height: 1.15;
    margin: 0;
  }
  .label-text {
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .sub-text {
    font-size: clamp(18px, 3.5vw, 26px);
    font-weight: 500;
    color: var(--muted);
    margin: 0;
  }
  .char-wrap img, .picture-wrap img {
    max-width: 92vw;
    max-height: 80vh;
    object-fit: contain;
    display: block;
  }
  /* composite-stage's width/height are set inline by JS (buildCompositeStage /
     applyStageSize) so the box is deliberately sized to fit within the
     available screen space with room to spare — see STAGE_WIDTH_FRACTION /
     STAGE_HEIGHT_FRACTION below if it ever needs to be nudged bigger/smaller. */
  .composite-stage {
    position: relative;
  }
  .composite-stage img,
  .composite-stage .placeholder {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  img.faded {
    opacity: 0.2; /* re-drill backdrop, done in code instead of a separate "-50" asset */
  }
  @keyframes popIn {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .pop-in {
    transform-origin: center;
    animation: popIn 0.4s ease-out;
  }
  .placeholder {
    display: flex; align-items: center; justify-content: center;
    width: min(70vw, 480px);
    aspect-ratio: 4 / 3;
    border: 2px dashed var(--line);
    border-radius: 12px;
    background: #fafafa;
    color: var(--muted);
    font-size: 15px;
    padding: 12px;
    text-align: center;
  }
  .placeholder.small { width: 34vw; }
  /* READING PHASE — two mascots/letters side by side; whichever one is
     "active" this tap pulses in place (see .reading-box--pulse) instead of
     an arrow pointing at it. Always right-to-left (Sa on the right, Ba on
     the left) to match how סַבָּא is actually spelled/read in Hebrew — true
     for the mascot rounds AND the real-letter round, not just the letters. */
  .reading-pair {
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    justify-content: center;
    gap: 4vw;
    width: 100%;
  }
  .reading-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  /* Reading-pair mascot/letter round: a fixed-size absolute canvas (see
     buildReadingStage in the JS) rather than a flex row. Sa's box and Ba's
     box are positioned independently with fixed pixel coordinates computed
     once per frame — neither can push or resize the other, matching how the
     reference slide deck itself is built
     (separate objects, manually placed, allowed to sit wherever they need
     to). */
  .reading-stage {
    position: relative;
  }
  .reading-box {
    position: absolute; /* left/top/width/height set inline by JS */
    display: flex;
    /* Bottom-anchored (not centered): a mascot image fills the box edge to
       edge via .reading-box-img below (this alignment doesn't apply to it,
       since it's positioned absolutely), but the letters round's plain text
       is a normal in-flow child — centering it vertically in the same tall
       square box as a mascot left a lot of empty box below the glyph. */
    align-items: flex-end;
    justify-content: center;
  }
  .reading-box-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* ATTENTION CUE — replaces the arrow entirely (see buildReadingStage's
     comment for why): the active side pulses in place, twice, instead of a
     separate arrow element appearing next to it. Nothing is added to or
     removed from the DOM for this — it's a specific element animating — so
     there's no separate element whose appearance/disappearance could ever
     be mistaken for affecting its neighbor. Scales from and back to 100%
     (never from/to 0) — a "pulse," not a "grow from nothing."
     Applied to the ONE focal element inside a box — the character image
     (plain or composite-overlay) or the letter text — never to a
     composite's faded base picture and never to the box itself. This
     mirrors how Noam actually teaches it in person: the picture stays put,
     only the character/letter being called out moves. */
  @keyframes readingPulse {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.28); }
    50% { transform: scale(1); }
    75% { transform: scale(1.28); }
  }
  .reading-box--pulse {
    animation: readingPulse 1.6s ease-in-out 1;
  }
  .hebrew-text {
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 700;
    direction: rtl;
    margin: 0 0 10px 0;
  }
  .saba-illustration {
    max-width: 38vw;
    max-height: 60vh;
    object-fit: contain;
    display: block;
  }
  #caption-bar {
    height: var(--caption-h);
    flex-shrink: 0;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    font-size: clamp(15px, 2.6vw, 19px);
    text-align: center;
  }
  #hud {
    position: fixed;
    top: 8px; right: 12px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    z-index: 20;
  }
  #frame-id {
    position: fixed;
    top: 8px; left: 12px;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #bbb;
    background: rgba(0,0,0,0.04);
    padding: 2px 6px;
    border-radius: 4px;
    z-index: 20;
    display: none;
  }
  #frame-id.show { display: block; }
  #back-btn {
    position: fixed;
    bottom: calc(var(--caption-h) + 10px);
    left: 10px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    z-index: 20;
  }
  .blank-line {
    display: inline-block;
    min-width: 3em;
    border-bottom: 3px solid var(--ink);
    margin: 0 6px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="content"></div>
  <div id="caption-bar"><span id="caption-text"></span></div>
</div>
<div id="hud"></div>
<div id="frame-id"></div>
<div id="back-btn">&#8249;</div>

<script>
/* =========================================================================
   SABA TEACHING SLIDESHOW — Pass 1 (functional)
   Zuriel Yahav method: Sa + Ba -> Saba

   HOW TO EDIT
   -----------
   1) ASSETS: put your PNGs in this same folder and reference the exact
      filenames below. If a filename is left blank or the file isn't found
      yet, the deck shows a dashed placeholder box naming the missing file
      instead of crashing — safe to open and click through right now.

   2) LETTERS / PARTS: each letter has an ordered "parts" list (label text
      for each anchor point in its picture). Edit labels/order freely —
      the whole cycle (reveal, anchor, re-drill, blank, recall) rebuilds
      itself from this data. Sa and Ba currently use PLACEHOLDER part
      labels (handle/body/weave, neck/body/base) — swap in the real
      breakdown whenever you have it.

   3) CAPTIONS: CAPTIONS[frameId] = 'subtitle text'. Leave '' for silence.
      Press the "i" key while viewing the deck to show each frame's id in
      the top-left corner, so you know which id to paste text against.

   4) MOMENTS: MOMENTS.onX(...) functions are called at key beats but do
      nothing yet — Pass 2 hooks confetti/sound/animation here.

   NAVIGATION (for you, while teaching)
   -------------------------------------
   Tap anywhere            -> next slide
   Tiny "‹" bottom-left     -> previous slide
   Arrow keys / space       -> next / previous (for testing on a Mac)
   "i" key                  -> toggle frame-id overlay (for caption editing)
   ========================================================================= */

  // ---------------------------------------------------------------------
  // 1) ASSETS — drop files into the "assets" folder next to this HTML file.
  //    Naming convention (Noam's):
  //      {char}-{picture}-c.png     full character alone
  //      {char}-{picture}-i.png     the plain picture ("image")
  //      {char}-{picture}-e1.png    element 1 overlay (transparent, registered to i.png)
  //      {char}-{picture}-e2.png    element 2 overlay, e3/e4 etc. as needed
  //    All same-canvas files stack at 0,0 and register perfectly.
  //    (No separate "-50" faded file needed — the 50% opacity re-drill
  //    backdrop is done in code from the same -c.png, so there's only one
  //    character file to keep in sync per letter.)
  // ---------------------------------------------------------------------
  const ASSETS = {
    sa_character:   'assets/sa-sal-c.png',
    sal_picture:    'assets/sa-sal-i.png',
    ba_character:   'assets/ba-bakbuk-c.png',
    bakbuk_picture: 'assets/ba-bakbuk-i.png',
    arrow_img:       'assets/arrow.png',
    saba_illustration: 'assets/saba.png', // still image placeholder — swap for a short clip later, same slot
  };

  // ---------------------------------------------------------------------
  // 2) LETTERS — PLACEHOLDER element breakdowns below (marked EDIT ME).
  //    Swap in the real Sal / Bakbuk elements any time — any number of
  //    elements works (2, 3, or 4), no code changes needed.
  //
  //    Each element is a TRANSPARENT overlay PNG (just the red-circle
  //    marker) sized/registered to sit exactly on top of the picture (round 1)
  //    or the faded picture + character (round 2 re-drill) below it.
  //
  //    `origin`: the "x% y%" point (as measured across that element PNG's
  //    own canvas) to scale the pop-in animation from — the center of the
  //    visible red mark, not the center of the mostly-transparent canvas.
  //    Precomputed from the actual file (measured, not detected live in the
  //    browser). Recompute this any time that element's PNG is replaced.
  // ---------------------------------------------------------------------
  const LETTERS = {
    sa: {
      id: 'sa',
      name: 'Sa',
      characterImg: ASSETS.sa_character,
      pictureImg: ASSETS.sal_picture,
      pictureName: 'Sal',
      elements: [
        { id: 'ring', overlayImg: 'assets/sa-sal-e1.png', label: 'This is the ring', origin: '37% 58%' },
        { id: 'net',  overlayImg: 'assets/sa-sal-e2.png', label: 'This is the net',  origin: '37% 77%' },
      ],
    },
    ba: {
      id: 'ba',
      name: 'Ba',
      characterImg: ASSETS.ba_character,
      pictureImg: ASSETS.bakbuk_picture,
      pictureName: 'Bakbuk',
      elements: [ // EDIT ME — placeholder bottle elements + placeholder origins
        { id: 'neck', overlayImg: 'assets/ba-bakbuk-e1.png', label: 'This is the neck', origin: '50% 50%' },
        { id: 'body', overlayImg: 'assets/ba-bakbuk-e2.png', label: 'This is the body', origin: '50% 50%' },
        { id: 'base', overlayImg: 'assets/ba-bakbuk-e3.png', label: 'This is the base', origin: '50% 50%' },
      ],
    },
  };

  // ---------------------------------------------------------------------
  // 3) CAPTIONS — paste narration/subtitle text per frame id. Empty = silent.
  //    (Frame ids are auto-listed after the deck builds; press "i" to see them live.)
  // ---------------------------------------------------------------------
  const CAPTIONS = {
    // 'sa-character': 'Hi, I\'m Sa!',
  };

  // ---------------------------------------------------------------------
  // 4) MOMENT HOOKS — no-ops in Pass 1. Pass 2 attaches effects here.
  // ---------------------------------------------------------------------
  const MOMENTS = {
    onCorrectAnswerConfirmed(frame) {},
    onCycleComplete(letterId) {},
    onFinalWordRevealed() {},
  };

  // =========================================================================
  // TEMPLATE ENGINE — builds one letter's full teaching cycle from its data.
  // You shouldn't need to edit below this line to change content.
  // =========================================================================

  function buildCycleFrames(L) {
    const frames = [];

    // 1. Reveal character alone + tease hiding spot — ONE frame, one tap
    // ("This is Sa. Sa likes hiding in there…" said together, then tap).
    frames.push({
      id: `${L.id}-character`,
      kind: 'solo-character',
      img: L.characterImg,
      text: `This is ${L.name}. ${L.name} likes hiding in the…`,
    });

    // 2. Reveal picture (no breakdown yet)
    frames.push({
      id: `${L.id}-picture`,
      kind: 'picture-reveal',
      img: L.pictureImg,
      text: `${L.pictureName}!`,
    });

    // 3..n. Anchor each element on the plain picture — CUMULATIVE: every
    // previously-shown element overlay stays on screen, the new one is
    // added on top of it (never replaced).
    const shownOnPicture = [];
    L.elements.forEach((elmt) => {
      shownOnPicture.push(elmt.overlayImg);
      frames.push({
        id: `${L.id}-anchor-${elmt.id}`,
        kind: 'anchor',
        imgs: [L.pictureImg, ...shownOnPicture],
        animateSrc: elmt.overlayImg, // only the element that's new THIS tap pops in
        animateOrigin: elmt.origin,
        text: elmt.label,
      });
    });

    // ROUND 2 (re-drill): the character stays on screen at 100% opacity for
    // the whole round, stacked over the picture faded to 50% — and elements
    // accumulate on top of THAT, the same "everything stays, new thing adds
    // on" rule as round 1. Nothing is ever withheld/blanked; every element
    // gets shown, then a final tap confirms the picture's name.
    const redrillBase = [L.pictureImg, L.characterImg]; // faded picture + character, present for all of round 2
    frames.push({
      id: `${L.id}-redrill-character`,
      kind: 'anchor',
      imgs: [...redrillBase],
      fadeBase: true,
      text: `${L.name}!`,
    });

    const shownInRedrill = [];
    L.elements.forEach((elmt) => {
      shownInRedrill.push(elmt.overlayImg);
      frames.push({
        id: `${L.id}-redrill-${elmt.id}`,
        kind: 'anchor',
        imgs: [...redrillBase, ...shownInRedrill],
        fadeBase: true,
        animateSrc: elmt.overlayImg, // only the element, never the character, pops in
        animateOrigin: elmt.origin,
        text: elmt.label,
      });
    });

    // Confirm the picture's name — back to the full-opacity picture, no
    // character, no element overlays.
    frames.push({
      id: `${L.id}-redrill-answer`,
      kind: 'picture-reveal',
      img: L.pictureImg,
      text: `${L.pictureName}!`,
      moment: 'onCorrectAnswerConfirmed',
    });

    // Cold recall test — same "faded picture + character" look as the
    // re-drill transition, reused as the recall cue, then confirmed with
    // the full-opacity picture again.
    frames.push({
      id: `${L.id}-recall-prompt`,
      kind: 'anchor',
      imgs: [...redrillBase],
      fadeBase: true,
      text: `${L.name} likes hiding in the…?`,
    });
    frames.push({
      id: `${L.id}-recall-answer`,
      kind: 'recall-answer',
      img: L.pictureImg,
      text: `${L.pictureName}!`,
      moment: 'onCorrectAnswerConfirmed',
    });

    // End-of-cycle celebration — plain "Yay!" text, no mascot/decoration (Pass 2 attaches effects later)
    frames.push({
      id: `${L.id}-yay`,
      kind: 'yay',
      text: 'Yay!',
      moment: 'onCycleComplete',
      momentArg: L.id,
    });

    return frames;
  }

  // Phase 2 — "where's it hiding?" reinforcement, done AFTER both letters'
  // full teaching cycles are complete (Sa fully taught, then Ba fully
  // taught, then this). For each letter: the character sits at full
  // opacity over its picture faded to 20% (same look/asset/fade as the
  // in-cycle re-drill — no new images needed), Noam asks live where it
  // hides, then one tap reveals the plain full-opacity picture as the
  // answer. No element overlays here — just the hiding-spot recall.
  function buildHidingRecall() {
    const frames = [];
    [LETTERS.sa, LETTERS.ba].forEach((L) => {
      frames.push({
        id: `${L.id}-hiding-prompt`,
        kind: 'anchor',
        imgs: [L.pictureImg, L.characterImg],
        fadeBase: true,
        text: `Where does ${L.name} like to hide?`,
      });
      frames.push({
        id: `${L.id}-hiding-answer`,
        kind: 'picture-reveal',
        img: L.pictureImg,
        text: `${L.pictureName}!`,
        moment: 'onCorrectAnswerConfirmed',
      });
    });
    return frames;
  }

  // Phase 3 — reading. Sa and Ba are called by name (character mascots first,
  // then the real Hebrew letters), taking turns: teacher demonstrates once,
  // then the kid does it. Whichever side isn't "active" for a given tap just
  // sits there as a plain, unfaded character/letter — nothing about it
  // changes until it's its turn.
  //
  // Slot shapes (used for both `sa` and `ba` on every reading-pair frame):
  //   { type: 'character', src }               — plain mascot image, cropped
  //                                              through its OWN ink window
  //                                              (see the crop-system
  //                                              comment above) so Sa and Ba
  //                                              stay visually consistent
  //                                              with EACH OTHER when shown
  //                                              side by side alone.
  //   { type: 'composite', base, overlay }     — mascot at full opacity over
  //                                              its picture faded to 20%,
  //                                              rendered as two separately
  //                                              stacked images so the pulse
  //                                              (see buildReadingBox) can
  //                                              animate the character alone
  //                                              without moving the picture
  //   { type: 'text', text }                   — a real Hebrew letter cluster
  //
  // `active`: 'sa' | 'ba' | null — which side (if any) pulses this tap.
  // Every reading-pair frame renders right-to-left (Sa on the right, Ba on
  // the left, via .reading-pair's row-reverse) since סַבָּא is spelled/read
  // that way in Hebrew — true for the mascot rounds too, not just the letters.
  function buildReadingPhase() {
    const sa = LETTERS.sa;
    const ba = LETTERS.ba;

    const saCharacter = { type: 'character', src: sa.characterImg };
    const baCharacter = { type: 'character', src: ba.characterImg };
    const saComposite = { type: 'composite', base: sa.pictureImg, overlay: sa.characterImg };
    const baComposite = { type: 'composite', base: ba.pictureImg, overlay: ba.characterImg };
    const saLetter = { type: 'text', text: 'סַ' };
    const baLetter = { type: 'text', text: 'בָּא' };

    return [
      // Round 1 — teacher demonstrates each name in turn.
      { id: 'reading-intro', kind: 'reading-pair', sa: saCharacter, ba: baCharacter, active: null,
        text: 'Let’s call them by their names, one at a time. I’ll go first.' },
      { id: 'reading-demo-sa', kind: 'reading-pair', sa: saComposite, ba: baCharacter, active: 'sa',
        text: 'Sa!' },
      { id: 'reading-demo-ba', kind: 'reading-pair', sa: saCharacter, ba: baComposite, active: 'ba',
        text: 'Ba!' },

      // Round 2 — same visuals, kid's turn (silent prompts).
      { id: 'reading-your-turn', kind: 'reading-pair', sa: saCharacter, ba: baCharacter, active: null,
        text: 'Now it’s your turn.' },
      { id: 'reading-kid-sa', kind: 'reading-pair', sa: saComposite, ba: baCharacter, active: 'sa',
        text: '' },
      { id: 'reading-kid-ba', kind: 'reading-pair', sa: saCharacter, ba: baComposite, active: 'ba',
        text: '' },

      // Round 3 — same drill, now with the real letters (gap between them).
      { id: 'reading-letters-intro', kind: 'reading-pair', sa: saLetter, ba: baLetter, active: null,
        text: 'Again!' },
      { id: 'reading-letters-sa', kind: 'reading-pair', sa: saLetter, ba: baLetter, active: 'sa',
        text: 'Sa!' },
      { id: 'reading-letters-ba', kind: 'reading-pair', sa: saLetter, ba: baLetter, active: 'ba',
        text: 'Ba!' },
      { id: 'reading-letters-combine', kind: 'reading-pair', sa: saLetter, ba: baLetter, active: null,
        text: 'What did we get?' },

      // Final reveal — the gap closes into one real word, illustration alongside.
      { id: 'saba-reveal', kind: 'saba-reveal', img: ASSETS.saba_illustration, text: 'סַבָּא',
        moment: 'onFinalWordRevealed' },
    ];
  }

  function buildDeck() {
    return [
      ...buildCycleFrames(LETTERS.sa),
      ...buildCycleFrames(LETTERS.ba),
      ...buildHidingRecall(),
      ...buildReadingPhase(),
    ];
  }

  // =========================================================================
  // RENDER ENGINE
  // =========================================================================

  const frames = buildDeck();
  // Auto-fill any caption not explicitly set, so CAPTIONS always has every id.
  frames.forEach((f) => { if (!(f.id in CAPTIONS)) CAPTIONS[f.id] = ''; });

  // Preload every image referenced anywhere in the deck up front, so the
  // browser already has each one decoded/cached by the time a tap reaches
  // it — this is what removes the jump/stutter on first visit to a slide.
  // Also cache each image's natural width/height as soon as it's known, so
  // the stage can be sized correctly on the very first paint instead of
  // waiting for an onload — this is what keeps size/position locked across
  // every slide instead of momentarily snapping to a fallback box.
  const imageDims = new Map();

  // MASCOT SIZE CONSISTENCY — reading-pair frames show the SAME letter's
  // slot in two different states across consecutive taps: alone (a plain
  // doodle on an otherwise-empty 700x700 canvas, filling maybe ~20-30% of
  // it) and composite (that same doodle stacked on its own full-bleed
  // picture, which naturally fills nearly all of its own canvas). Both
  // states render inside an identically-sized square box — guaranteed by
  // applyStageSize, since every source PNG (character AND picture) is a
  // 700x700 square, so the fit-to-budget math always lands on the same box
  // regardless of which one is showing. But within that same box, a doodle
  // whose ink only occupies a fifth of its own canvas looks tiny next to a
  // picture that fills nearly all of its canvas — so the mascot visibly
  // "grows" the instant its composite replaces its plain rendering, even
  // though the box itself never moves or resizes.
  //
  // An earlier attempt tried to fix this with a CSS transform: recenter +
  // scale up the raw <img> based on its detected ink bounds, clamped to 3x
  // to avoid absurd blow-ups. That clamp is exactly what broke it: mascots
  // with very small ink (like Ba's bracket-and-dot) never actually reached
  // the target fill fraction even at 3x, so some mascots undershot, others
  // (once the box grew) overshot, and the plain-vs-composite mismatch
  // persisted.
  //
  // Fixed properly this time by baking the fix into the PIXELS instead of a
  // transform: crop each plain mascot down to a new square canvas, centered
  // on its own ink, sized so the ink occupies exactly
  // MASCOT_INK_FILL_FRACTION of that new square — then use that cropped
  // image (still square, like the original) as the actual <img src>. Since
  // it's still square, applyStageSize computes the exact same box as
  // before, and since it's a real crop rather than a clamped transform,
  // every mascot reliably ends up filling the same fraction of its box, no
  // matter how small its original ink footprint was.
  //
  // Never applied to a composite (character stacked on its own faded
  // picture) — that alignment must stay exactly as registered, unshifted,
  // uncropped, since that's what makes the character appear to "hide
  // inside" the picture correctly. This deck runs over https via GitHub
  // Pages, where reading pixel data back out of a same-origin canvas is
  // allowed, so this crop can be computed automatically instead of
  // hand-tuned per asset.
  // Measured directly off the actual picture assets: the "picture" half of a
  // composite (sa-sal-i.png, ba-bakbuk-i.png) has its own ink spanning
  // ~76-80% of its 700x700 canvas — that's the real target to match, not a
  // guess. (0.85, tried first, overshot past even the composite's own fill
  // and made plain mascots look BIGGER than their composites — the opposite
  // of consistent.)
  const MASCOT_INK_FILL_FRACTION = 0.78; // how much of the new square a mascot's ink should occupy
  function computeInkBBoxPixels(imgEl) {
    try {
      const w = imgEl.naturalWidth, h = imgEl.naturalHeight;
      if (!w || !h) return null;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(imgEl, 0, 0);
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
      const step = 2; // every other pixel — plenty precise for this, much faster
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          if (data[(y * w + x) * 4 + 3] > 10) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) return null;
      return { minX, minY, maxX, maxY };
    } catch (e) {
      return null; // canvas blocked for some reason — falls back to unadjusted rendering
    }
  }
  function loadImageForCrop(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }
  // Computes the crop window (center + square size) from a REFERENCE
  // image's own ink bounds, sized so that ink fills MASCOT_INK_FILL_FRACTION
  // of the resulting square. Whatever image is later cropped through this
  // same window lands in the exact same coordinate space as the reference.
  function computeCropWindow(referenceImg) {
    const bbox = computeInkBBoxPixels(referenceImg);
    if (!bbox) return null;
    const bboxW = bbox.maxX - bbox.minX;
    const bboxH = bbox.maxY - bbox.minY;
    const cx = (bbox.minX + bbox.maxX) / 2;
    const cy = (bbox.minY + bbox.maxY) / 2;
    const longest = Math.max(bboxW, bboxH) || 1;
    const canvasSize = Math.max(1, Math.round(longest / MASCOT_INK_FILL_FRACTION));
    return { cx, cy, canvasSize };
  }
  function cropImageToWindow(img, win) {
    if (!img || !win) return null;
    const canvas = document.createElement('canvas');
    canvas.width = win.canvasSize;
    canvas.height = win.canvasSize;
    const ctx = canvas.getContext('2d');
    try {
      // Source rectangle is centered on the window's own center; any part of
      // it that falls outside the original image's bounds is simply left
      // transparent by drawImage — exactly the padding we want.
      ctx.drawImage(img, win.cx - win.canvasSize / 2, win.cy - win.canvasSize / 2, win.canvasSize, win.canvasSize, 0, 0, win.canvasSize, win.canvasSize);
      return canvas.toDataURL();
    } catch (e) {
      return null; // tainted canvas or similar — falls back to unadjusted rendering
    }
  }

  // CROP SYSTEM — two DIFFERENT crop windows are used on purpose, each
  // solving a different problem, both keyed off the same generic
  // getCroppedImage(referenceSrc, imgSrc) helper:
  //
  //   - A plain "character alone" slot crops the character through a window
  //     centered on ITS OWN ink (getCroppedImage(src, src)) — this is what
  //     makes Sa and Ba look consistently sized/centered next to each other
  //     on the intro/your-turn screens, regardless of how differently each
  //     character sits within its own picture.
  //   - A composite's base + overlay both crop through a window centered on
  //     the PICTURE's ink (getCroppedImage(base, base) and
  //     getCroppedImage(base, overlay)) — this keeps the character exactly
  //     where it's actually drawn relative to the picture (the "hides
  //     inside the picture" registration), at its true embedded scale.
  //
  // A same-letter character's OWN crop and its EMBEDDED (within-composite)
  // scale are therefore generally NOT identical — a character can look
  // bigger alone than it does once its picture reveals it nested inside a
  // bigger scene, because that's its actual drawn scale in that picture. An
  // attempt to force both states through the picture's window (so the
  // character would never change size when the picture appears) was tried
  // and reverted: it broke the alone-state pairing instead, since Sa's and
  // Ba's characters sit at very different scales within their own pictures
  // (confirmed visually — Sa's plain circle came out much smaller than Ba's
  // plain bracket, when both used to match). Trading a working comparison
  // for a smoother reveal wasn't the right trade — this reverts back.
  const cropWindowCache = new Map(); // referenceSrc -> Promise<window|null>
  function getCropWindow(referenceSrc) {
    if (!cropWindowCache.has(referenceSrc)) {
      cropWindowCache.set(referenceSrc, loadImageForCrop(referenceSrc).then((img) => (img ? computeCropWindow(img) : null)));
    }
    return cropWindowCache.get(referenceSrc);
  }
  const croppedImageCache = new Map(); // "referenceSrc|imgSrc" -> Promise<dataURL|null>
  function getCroppedImage(referenceSrc, imgSrc) {
    const key = `${referenceSrc}|${imgSrc}`;
    if (!croppedImageCache.has(key)) {
      croppedImageCache.set(key, Promise.all([getCropWindow(referenceSrc), loadImageForCrop(imgSrc)])
        .then(([win, img]) => cropImageToWindow(img, win)));
    }
    return croppedImageCache.get(key);
  }
  // Fills an already-in-the-DOM <img> once its cropped version is ready.
  // Nothing shifts when this resolves — the img has no content until then,
  // so there's no "before" state to jump from.
  function applyCroppedSrc(imgEl, referenceSrc, imgSrc) {
    getCroppedImage(referenceSrc, imgSrc).then((dataUrl) => {
      if (dataUrl) imgEl.src = dataUrl;
    });
  }

  // Pulls every image src a frame references, whatever shape that frame is —
  // including reading-pair's per-side slot specs (character/composite slots
  // carry image srcs, text slots don't).
  function collectFrameSrcs(f) {
    const srcs = [].concat(f.img || [], f.imgs || []);
    if (f.kind === 'reading-pair') {
      [f.sa, f.ba].forEach((slot) => {
        if (!slot) return;
        if (slot.type === 'composite') srcs.push(slot.base, slot.overlay);
        else if (slot.type === 'character') srcs.push(slot.src);
      });
    }
    return srcs.filter(Boolean);
  }
  function preloadAllImages(allFrames) {
    const seen = new Set();
    allFrames.forEach((f) => {
      collectFrameSrcs(f).forEach((src) => {
        if (src && !seen.has(src)) {
          seen.add(src);
          const preloadEl = new Image();
          preloadEl.onload = () => {
            imageDims.set(src, { w: preloadEl.naturalWidth, h: preloadEl.naturalHeight });
          };
          preloadEl.src = src;
        }
      });
    });
  }
  preloadAllImages(frames);
  // Warms cropWindowCache/croppedImageCache for every reading-pair slot AT
  // PAGE LOAD, before the person ever taps into that phase. Confirmed by
  // direct measurement: without this, the FIRST time a given crop is needed
  // each page load, its <img> genuinely sits blank (src="", naturalWidth=0)
  // for 40-60ms while the crop canvas work runs, THEN pops in fully formed —
  // a real, reproducible blank-then-pop, not a position bug. This makes that
  // one-time cost happen silently in the background at load, so every crop
  // is already sitting in cache before it's ever needed on screen.
  function precomputeReadingPairAssets(allFrames) {
    allFrames.forEach((f) => {
      if (f.kind !== 'reading-pair') return;
      [f.sa, f.ba].forEach((spec) => {
        if (!spec) return;
        if (spec.type === 'composite') {
          getCroppedImage(spec.base, spec.base);
          getCroppedImage(spec.base, spec.overlay);
        } else if (spec.type === 'character') {
          getCroppedImage(spec.src, spec.src);
        }
      });
    });
  }
  precomputeReadingPairAssets(frames);

  let index = 0;
  const contentEl = document.getElementById('content');
  const captionEl = document.getElementById('caption-text');
  const hudEl = document.getElementById('hud');
  const frameIdEl = document.getElementById('frame-id');

  function imgOrPlaceholder(src, extraClass) {
    if (!src) {
      const d = document.createElement('div');
      d.className = 'placeholder' + (extraClass ? ' ' + extraClass : '');
      d.textContent = '[image not set]';
      return d;
    }
    const img = document.createElement('img');
    if (extraClass) img.className = extraClass;
    img.src = src;
    img.alt = src;
    img.onerror = function () {
      const d = document.createElement('div');
      d.className = 'placeholder' + (extraClass ? ' ' + extraClass : '');
      d.textContent = `[missing: ${src}]`;
      img.replaceWith(d);
    };
    return img;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // How big the on-screen "scene" box gets, as a fraction of the available
  // content area (which already excludes the caption bar). Turn these down
  // to shrink everything, up to grow it — this is the one place to tune it.
  const STAGE_WIDTH_FRACTION = 0.62;
  const STAGE_HEIGHT_FRACTION = 0.68;
  // Sizing budget for each mascot box in a reading-pair frame (see
  // buildReadingStage below). Deliberately smaller than a solo stage:
  // Yahav's own single-character slides run a mascot at roughly a third of
  // the slide's real estate, and showing TWO of them side by side (our own
  // adaptation, not something his single-character method ever does) needs
  // to land well under that per side to read as "a pair," not "two
  // full-size scenes crammed together."
  const READING_BOX_WIDTH_FRACTION = 0.2;
  const READING_BOX_HEIGHT_FRACTION = 0.32;
  const READING_GAP_FRACTION = 0.05; // gap between the two boxes, as a fraction of contentEl's width
  const FALLBACK_DIMS = { w: 4, h: 3 }; // used only until an image's real size is known

  // Fits a box of `dims` aspect ratio inside a fraction of contentEl's box,
  // on BOTH axes at once (unlike CSS aspect-ratio alone, which only fixes
  // one axis and can overflow the other) — this is what guarantees the
  // scene is always "big enough but not too big, with room to spare"
  // regardless of whether an image is tall, wide, or square. Defaults to
  // the solo-stage fractions; pass smaller ones (see PAIR_*_FRACTION above)
  // when the stage has to share the row with another one.
  function applyStageSize(stage, dims, widthFraction, heightFraction) {
    const rect = contentEl.getBoundingClientRect();
    const maxW = rect.width * (widthFraction || STAGE_WIDTH_FRACTION);
    const maxH = rect.height * (heightFraction || STAGE_HEIGHT_FRACTION);
    const scale = Math.min(maxW / dims.w, maxH / dims.h);
    stage.style.width = `${Math.round(dims.w * scale)}px`;
    stage.style.height = `${Math.round(dims.h * scale)}px`;
  }

  // Builds a same-size, same-position stage for ANY canvas-scale image —
  // character alone, plain picture, or a picture/character with one or more
  // transparent element overlays stacked on top at 0,0 so pre-registered
  // PNGs line up automatically. Every frame kind that shows the "scene"
  // (character, picture, elements) goes through this ONE function so the
  // box is always identical — that's what keeps size/position locked
  // across every slide instead of jumping between different sizing rules.
  // `overlaySrcs` is an array (possibly empty) applied in order, so earlier
  // elements stay visible underneath later ones (cumulative, never swapped
  // out). `fadeBase` dims the base image to 50% opacity in code (the
  // re-drill look) without needing a second "-50" asset file.
  // Caches, per image src, the "x% y%" transform-origin that sits at the
  // center of that PNG's actual visible (non-transparent) mark — computed
  // once by scanning pixel alpha via an offscreen canvas. Needed because
  // each element overlay is a mostly-transparent full-canvas PNG, so
  // scaling from the box's geometric center (the default) makes the small
  // visible red mark appear to drift instead of growing in place.
  // `animateSrc` + `animateOrigin`: the ONE overlay src (an element marker,
  // never the character) that should play the pop-in scale for this tap,
  // and the "x% y%" transform-origin to scale it from. The origin is a
  // precomputed constant per element (see each element's `origin` field in
  // LETTERS below) rather than detected at runtime — Chrome blocks reading
  // pixel data back out of a canvas for file:// images (a "tainted canvas"
  // security restriction), so scanning for the visible mark's true center
  // in-browser isn't reliable here. Whenever an element's PNG is replaced,
  // its `origin` should be recomputed (quick to redo, ask and it's a
  // one-line update — no restructuring).
  // `widthFraction`/`heightFraction`: override the default solo-stage sizing
  // budget. (Reading-pair frames no longer go through this function — see
  // buildReadingStage/buildReadingBox, which position their own boxes on a
  // fixed absolute canvas instead — but the override params are left here
  // in case a future solo-stage variant needs a different budget.)
  function buildCompositeStage(baseSrc, overlaySrcs, fadeBase, animateSrc, animateOrigin, widthFraction, heightFraction) {
    const stage = el('div', 'composite-stage');
    const knownDims = baseSrc && imageDims.get(baseSrc);
    applyStageSize(stage, knownDims || FALLBACK_DIMS, widthFraction, heightFraction);
    const base = imgOrPlaceholder(baseSrc);
    if (base.tagName === 'IMG') {
      if (fadeBase) base.classList.add('faded');
      if (!knownDims) {
        base.onload = () => {
          if (base.naturalWidth && base.naturalHeight) {
            const dims = { w: base.naturalWidth, h: base.naturalHeight };
            imageDims.set(baseSrc, dims);
            applyStageSize(stage, dims, widthFraction, heightFraction);
          }
        };
      }
    }
    stage.appendChild(base);
    (overlaySrcs || []).forEach((src) => {
      if (!src) return;
      const overlayImg = imgOrPlaceholder(src);
      if (src === animateSrc && overlayImg.tagName === 'IMG') {
        overlayImg.style.transformOrigin = animateOrigin || '50% 50%';
        overlayImg.classList.add('pop-in');
      }
      stage.appendChild(overlayImg);
    });
    return stage;
  }

  // READING-PAIR LAYOUT — built as a fixed-size absolute-position canvas,
  // not a flexbox row. This directly mirrors how the reference Google
  // Slides deck is actually built: Sa's box, Ba's box, and each arrow are
  // independent objects with their own fixed coordinates, none of them
  // able to push or resize any other (Noam pointed this out directly,
  // looking at the bounding boxes in his own slide — the picture, the
  // character, and the arrow are three separate positioned objects, not one
  // box whose size depends on another). Every earlier "same row" /
  // "grows when the arrow appears" bug came from the flexbox version
  // computing each slot's box FROM its own content and then flowing it next
  // to its neighbor — an absolute canvas removes that mechanism entirely:
  // a box's position/size is set once, geometrically, from constants, and
  // nothing about its content (plain vs composite, active vs not) can ever
  // change it.
  function buildReadingBox(spec, isActive) {
    const box = el('div', 'reading-box');
    if (spec.type === 'text') {
      const textEl = el('p', 'hebrew-text', spec.text);
      if (isActive) textEl.classList.add('reading-box--pulse');
      box.appendChild(textEl);
      return box;
    }
    if (spec.type === 'composite') {
      // Two separately stacked images, NOT one flattened picture — the
      // static faded picture underneath, and the character on top of it as
      // its own element, so the pulse (below) can animate the character
      // alone without the picture moving with it. Both are cropped through
      // the IDENTICAL window (derived from the base picture's own ink — see
      // getCroppedImage) so they stay pixel-registered exactly as if they
      // were still one flattened image; only the animation target changes.
      const baseImg = document.createElement('img');
      baseImg.className = 'reading-box-img faded';
      baseImg.alt = spec.base;
      const overlayImg = document.createElement('img');
      overlayImg.className = 'reading-box-img';
      overlayImg.alt = spec.overlay;
      if (isActive) overlayImg.classList.add('reading-box--pulse');
      box.appendChild(baseImg);
      box.appendChild(overlayImg);
      applyCroppedSrc(baseImg, spec.base, spec.base);
      applyCroppedSrc(overlayImg, spec.base, spec.overlay);
      return box;
    }
    // Plain-mascot-alone: cropped through ITS OWN ink window — see the
    // crop-system comment above for why this (not the picture's window) is
    // what keeps Sa and Ba looking consistently sized/centered next to each
    // other on the intro/your-turn screens.
    const charImg = document.createElement('img');
    charImg.className = 'reading-box-img';
    charImg.alt = spec.src;
    if (isActive) charImg.classList.add('reading-box--pulse');
    box.appendChild(charImg);
    applyCroppedSrc(charImg, spec.src, spec.src);
    return box;
  }
  // Places an already-built box at fixed pixel coordinates within the
  // reading-stage — geometry only, completely independent of what's inside.
  function positionAbsolute(node, left, top, width, height) {
    node.style.position = 'absolute';
    node.style.left = `${Math.round(left)}px`;
    node.style.top = `${Math.round(top)}px`;
    if (width != null) node.style.width = `${Math.round(width)}px`;
    if (height != null) node.style.height = `${Math.round(height)}px`;
  }
  // Builds the whole reading-pair frame as one fixed canvas: Sa's box on the
  // right, Ba's box on the left (RTL, per Hebrew reading order) — every
  // coordinate computed once from contentEl's size and fixed constants,
  // never from any box's content.
  //
  // ATTENTION CUE: an experiment, replacing the arrow entirely. Every
  // attempt to fix a residual glitch on the arrow appearing/disappearing
  // came up short — confirmed one real bug (a composite's image sat
  // genuinely blank for a beat the first time it was shown) and fixed it,
  // but couldn't rule out something below what this deck's own tools can
  // observe. Rather than keep guessing at the arrow's timing, the active
  // side now pulses in place (twice) instead — same content, same box,
  // same position, no separate element being added/removed/repositioned at
  // all. If this still shows any hint of a glitch, that tells us clearly
  // it was never about the arrow specifically — it's the plain-to-composite
  // content swap itself. If it's smooth, we have a working version.
  function buildReadingStage(saSpec, baSpec, active) {
    const stage = el('div', 'reading-stage');
    const rect = contentEl.getBoundingClientRect();
    const boxSize = Math.min(rect.width * READING_BOX_WIDTH_FRACTION, rect.height * READING_BOX_HEIGHT_FRACTION);
    const gap = rect.width * READING_GAP_FRACTION;
    const centerX = rect.width / 2;
    const top = (rect.height - boxSize) / 2;
    const saLeft = centerX + gap / 2;
    const baLeft = centerX - gap / 2 - boxSize;
    stage.style.width = `${Math.round(rect.width)}px`;
    stage.style.height = `${Math.round(rect.height)}px`;

    const saBox = buildReadingBox(saSpec, active === 'sa');
    positionAbsolute(saBox, saLeft, top, boxSize, boxSize);

    const baBox = buildReadingBox(baSpec, active === 'ba');
    positionAbsolute(baBox, baLeft, top, boxSize, boxSize);

    stage.appendChild(saBox);
    stage.appendChild(baBox);
    return stage;
  }

  function renderFrame(frame) {
    contentEl.innerHTML = '';

    switch (frame.kind) {
      // NOTE: no on-screen text for the teaching-cycle frames below — Noam
      // narrates live and the caption strip (subtitle-style) carries the
      // words. frame.text is kept on the data for reference/Pass-2 use, it's
      // just not rendered here. ('Yay!' and the word-reveal are content in
      // their own right, not narration, so those still render text.)
      // solo-character / picture-reveal / anchor / blank / recall-prompt /
      // recall-answer ALL go through the same buildCompositeStage box, so
      // size and position never jump between them.
      case 'solo-character':
      case 'recall-prompt': {
        const stage = buildCompositeStage(frame.img, [], frame.fade);
        contentEl.appendChild(stage);
        break;
      }
      case 'picture-reveal':
      case 'recall-answer': {
        const stage = buildCompositeStage(frame.img, []);
        contentEl.appendChild(stage);
        break;
      }
      case 'anchor':
      case 'blank': {
        const stage = buildCompositeStage(frame.imgs[0], frame.imgs.slice(1), frame.fadeBase, frame.animateSrc, frame.animateOrigin);
        contentEl.appendChild(stage);
        break;
      }
      case 'yay': {
        // Plain blank screen + "Yay!" — no mascot/confetti/decoration in Pass 1.
        // Pass 2 attaches celebration effects to this same frame kind.
        contentEl.appendChild(el('p', 'big-text', frame.text));
        break;
      }
      case 'reading-pair': {
        // No on-screen text here either — same narration-lives-live rule as
        // the teaching-cycle frames above. frame.text is reference-only.
        contentEl.appendChild(buildReadingStage(frame.sa, frame.ba, frame.active));
        break;
      }
      case 'saba-reveal': {
        // Content in its own right (like 'yay'), not narration — the word
        // itself renders. Illustration alongside; swap frame.img for a clip
        // later without touching this case. Appended text-then-image so that
        // .reading-pair's row-reverse still lands the word on the right and
        // the illustration on the left, matching the reference slide.
        const wrap = el('div', 'reading-pair');
        const textSlot = el('div', 'reading-slot');
        textSlot.appendChild(el('p', 'hebrew-text', frame.text));
        const imgSlot = el('div', 'reading-slot');
        imgSlot.appendChild(imgOrPlaceholder(frame.img, 'saba-illustration'));
        wrap.appendChild(textSlot);
        wrap.appendChild(imgSlot);
        contentEl.appendChild(wrap);
        break;
      }
      default: {
        contentEl.appendChild(el('p', 'sub-text', `[unknown frame kind: ${frame.kind}]`));
      }
    }

    captionEl.textContent = CAPTIONS[frame.id] || '';
    hudEl.textContent = `${index + 1} / ${frames.length}`;
    frameIdEl.textContent = frame.id;

    if (frame.moment && MOMENTS[frame.moment]) {
      MOMENTS[frame.moment](frame.momentArg !== undefined ? frame.momentArg : frame);
    }
  }

  function goTo(i) {
    index = Math.max(0, Math.min(frames.length - 1, i));
    renderFrame(frames[index]);
  }
  function next() { goTo(index + 1); }
  function prev() { goTo(index - 1); }

  // Expose for Pass 2 / debugging
  window.SabaDeck = { frames, goTo, next, prev, get index() { return index; } };

  // --- Navigation wiring ---
  document.getElementById('stage').addEventListener('click', (e) => {
    if (e.target.closest('#back-btn')) return;
    next();
  });
  document.getElementById('back-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    prev();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { goTo(0); }
    else if (e.key.toLowerCase() === 'i') { frameIdEl.classList.toggle('show'); }
  });
  // Re-render on resize/orientation change so the stage box is re-fit to
  // the new screen size (e.g. rotating an iPad mid-lesson).
  window.addEventListener('resize', () => renderFrame(frames[index]));

  // Boot
  goTo(0);
</script>
</body>
</html>
