<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Saba Teaching Slideshow</title>
<style>
  :root {
    --caption-h: 56px;
    --ink: #1c1c1e;
    --paper: #ffffff;
    --muted: #8a8a8e;
    --line: #e2e2e5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper); color: var(--ink);
    touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
  }
  #content {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    padding: 32px 24px;
    text-align: center;
    overflow: hidden;
  }
  .big-text {
    font-size: clamp(32px, 7vw, 72px);
    font-weight: 800;
    line-height: 1.15;
    margin: 0;
  }
  .label-text {
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .sub-text {
    font-size: clamp(18px, 3.5vw, 26px);
    font-weight: 500;
    color: var(--muted);
    margin: 0;
  }
  .char-wrap img, .picture-wrap img {
    max-width: 92vw;
    max-height: 80vh;
    object-fit: contain;
    display: block;
  }
  /* composite-stage's width/height are set inline by JS (buildCompositeStage /
     applyStageSize) so the box is deliberately sized to fit within the
     available screen space with room to spare — see STAGE_WIDTH_FRACTION /
     STAGE_HEIGHT_FRACTION below if it ever needs to be nudged bigger/smaller. */
  .composite-stage {
    position: relative;
  }
  .composite-stage img,
  .composite-stage .placeholder {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  img.faded {
    opacity: 0.2; /* re-drill backdrop, done in code instead of a separate "-50" asset */
  }
  @keyframes popIn {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .pop-in {
    transform-origin: center;
    animation: popIn 0.4s ease-out;
  }
  .placeholder {
    display: flex; align-items: center; justify-content: center;
    width: min(70vw, 480px);
    aspect-ratio: 4 / 3;
    border: 2px dashed var(--line);
    border-radius: 12px;
    background: #fafafa;
    color: var(--muted);
    font-size: 15px;
    padding: 12px;
    text-align: center;
  }
  .placeholder.small { width: 34vw; }
  /* READING PHASE — two mascots/letters side by side; whichever one is
     "active" this tap pulses in place (see .reading-box--pulse) instead of
     an arrow pointing at it. Always right-to-left (Sa on the right, Ba on
     the left) to match how סַבָּא is actually spelled/read in Hebrew — true
     for the mascot rounds AND the real-letter round, not just the letters. */
  .reading-pair {
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    justify-content: center;
    gap: 4vw;
    width: 100%;
  }
  .reading-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  /* Reading-pair mascot/letter round: a fixed-size absolute canvas (see
     buildReadingStage in the JS) rather than a flex row. Sa's box and Ba's
     box are positioned independently with fixed pixel coordinates computed
     once per frame — neither can push or resize the other, matching how the
     reference slide deck itself is built
     (separate objects, manually placed, allowed to sit wherever they need
     to). */
  .reading-stage {
    position: relative;
  }
  .reading-box {
    position: absolute; /* left/top/width/height set inline by JS */
    display: flex;
    /* Bottom-anchored (not centered): a mascot image fills the box edge to
       edge via .reading-box-img below (this alignment doesn't apply to it,
       since it's positioned absolutely), but the letters round's plain text
       is a normal in-flow child — centering it vertically in the same tall
       square box as a mascot left a lot of empty box below the glyph. */
    align-items: flex-end;
    justify-content: center;
  }
  .reading-box-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* ATTENTION CUE — replaces the arrow entirely (see buildReadingStage's
     comment for why): the active side pulses in place ONCE, instead of a
     separate arrow element appearing next to it. Single pop, not a double
     bounce — Noam's call: this plays during a manual, tap-your-own-pace
     rhythm drill (sa-ba, sa-ba, then the same rhythm again with the real
     letters), and a double bounce broke that rhythm/felt cumbersome. This
     is purely how long the pop itself takes to play once triggered — it
     has nothing to do with how long the slide stays on screen, which is
     entirely up to the tap. Nothing is added to or removed from the DOM
     for this — it's a specific element animating — so there's no separate
     element whose appearance/disappearance could ever be mistaken for
     affecting its neighbor. Scales from and back to 100% (never from/to
     0) — a "pulse," not a "grow from nothing."
     Applied to the ONE focal element inside a box — the character image
     (plain or composite-overlay) or the letter text — never to a
     composite's faded base picture and never to the box itself. This
     mirrors how Noam actually teaches it in person: the picture stays put,
     only the character/letter being called out moves. */
  @keyframes readingPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.28); }
  }
  .reading-box--pulse {
    animation: readingPulse 0.8s ease-in-out 1;
  }
  .hebrew-text {
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 700;
    direction: rtl;
    margin: 0 0 10px 0;
  }
  .saba-illustration {
    max-width: 38vw;
    max-height: 60vh;
    object-fit: contain;
    display: block;
  }
  /* Saba reveal — Granddad's clip fills the same stage as the word (see
     buildSabaRevealStage), scaled/centered like any other stage content.
     Inserted as the stage's first child, so normal DOM paint order alone
     puts it under the letter boxes — no z-index needed. */
  .saba-reveal-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #caption-bar {
    height: var(--caption-h);
    flex-shrink: 0;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    font-size: clamp(15px, 2.6vw, 19px);
    text-align: center;
  }
  #hud {
    position: fixed;
    top: 8px; right: 12px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    z-index: 20;
  }
  #frame-id {
    position: fixed;
    top: 8px; left: 12px;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #bbb;
    background: rgba(0,0,0,0.04);
    padding: 2px 6px;
    border-radius: 4px;
    z-index: 20;
    display: none;
  }
  #frame-id.show { display: block; }
  #back-btn {
    position: fixed;
    bottom: calc(var(--caption-h) + 10px);
    left: 10px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    z-index: 20;
  }
  /* LOCKED DESIGN DECISION — "game UI" chrome layer (top bar, avatar,
     decorative icons later — no login/points, just look-and-feel), first
     inhabited by the saba-reveal confetti burst below: built exactly like
     #hud/#frame-id/#back-btn above — position: fixed, living outside
     #stage's flex flow entirely, never inside #content and never
     reserving real space in the flex column. The reading-round layout
     (mascots, letters, Grandad's clip) computes its pixel geometry from
     #content's LIVE measured rect (contentEl.getBoundingClientRect() in
     buildReadingStage/buildCompositeStage) — that math was tuned by eye
     and by pixel measurement across many iterations. A fixed-position
     overlay never changes that rect, so it's guaranteed not to disturb
     any of the teaching-phase alignment. If a bar ever needs to actually
     claim real document-flow space instead of overlaying (shrinking
     #content), that's still fine, but it changes the rect and means
     re-verifying the reading-round frames afterward — don't assume it's
     free the way a fixed-position overlay is. */
  #ui-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none; /* click-through — #stage's own click listener
                              is what advances the deck; this layer must
                              never intercept that tap, now or for
                              whatever gets added here later. */
    z-index: 25; /* above #hud/#frame-id/#back-btn (20), above #content */
  }
  #confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .blank-line {
    display: inline-block;
    min-width: 3em;
    border-bottom: 3px solid var(--ink);
    margin: 0 6px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="content"></div>
  <div id="caption-bar"><span id="caption-text"></span></div>
</div>
<div id="hud"></div>
<div id="frame-id"></div>
<div id="back-btn">&#8249;</div>
<!-- UI OVERLAY LAYER — see the "LOCKED DESIGN DECISION" comment above.
     Fixed, click-through, lives outside #stage entirely. Confetti canvas
     is the first thing in it; future game-UI chrome joins it here. -->
<div id="ui-overlay"><canvas id="confetti-canvas"></canvas></div>

<script>
/* =========================================================================
   SABA TEACHING SLIDESHOW
   Zuriel Yahav method. Chapter 1: Sa + Ba -> Saba. Chapter 2: Ka + Na -> Kana.
   Both chapters share the same generic frame-building functions below —
   see buildReadingPhase/buildReadingStage, parameterized over any letter
   pair plus an optional silent "companion" letter (Aleph for Ba, He for Na).

   HOW TO EDIT
   -----------
   1) ASSETS: put your PNGs in this same folder and reference the exact
      filenames below. If a filename is left blank or the file isn't found
      yet, the deck shows a dashed placeholder box naming the missing file
      instead of crashing — safe to open and click through right now.

   2) LETTERS / PARTS: each letter has an ordered "parts" list (label text
      for each anchor point in its picture). Edit labels/order freely —
      the whole cycle (reveal, anchor, re-drill, blank, recall) rebuilds
      itself from this data.

   3) CAPTIONS: CAPTIONS[frameId] = 'subtitle text'. Leave '' for silence.
      Press the "i" key while viewing the deck to show each frame's id in
      the top-left corner, so you know which id to paste text against.

   4) MOMENTS: MOMENTS.onX(...) functions are called at key beats — see
      buildSabaRevealStage for the confetti/sound hookup on word-reveal.

   NAVIGATION (for you, while teaching)
   -------------------------------------
   Tap anywhere            -> next slide
   Tiny "‹" bottom-left     -> previous slide
   Arrow keys / space       -> next / previous (for testing on a Mac)
   "i" key                  -> toggle frame-id overlay (for caption editing)
   ========================================================================= */

  // ---------------------------------------------------------------------
  // 1) ASSETS — drop files into the "assets" folder next to this HTML file.
  //    Naming convention (Noam's):
  //      {char}-{picture}-c.png     full character alone
  //      {char}-{picture}-i.png     the plain picture ("image")
  //      {char}-{picture}-e1.png    element 1 overlay (transparent, registered to i.png)
  //      {char}-{picture}-e2.png    element 2 overlay, e3/e4 etc. as needed
  //    All same-canvas files stack at 0,0 and register perfectly.
  //    (No separate "-50" faded file needed — the 50% opacity re-drill
  //    backdrop is done in code from the same -c.png, so there's only one
  //    character file to keep in sync per letter.)
  // ---------------------------------------------------------------------
  const ASSETS = {
    sa_character:   'assets/sa-sal-c.png',
    sal_picture:    'assets/sa-sal-i.png',
    ba_character:   'assets/ba-bakbuk-c.png',
    bakbuk_picture: 'assets/ba-bakbuk-i.png',
    arrow_img:       'assets/arrow.png',
    // Real Hebrew letters round — pre-rendered PNGs (Noam's Photoshop file,
    // Noto Sans Hebrew), NOT live CSS text. Each is a letter + its niqqud
    // baked into one flat image on a shared 700x700 canvas, same convention
    // as the mascot files above. See the LETTER-GLYPH WINDOW comment below
    // for why this replaced live text entirely.
    sa_letter_img: 'assets/samekh-kamatz.png',
    ba_letter_img: 'assets/bet-kamatz-dgsh.png',
    // Silent Aleph — properly, the word "Saba" is spelled Samech-Bet-Aleph
    // (סבא), with the Aleph carrying no sound of its own and no niqqud.
    // It always sits immediately to Ba's left (screen-left, since it comes
    // right after Bet reading right-to-left) — see aleph_letter_img usage
    // in buildReadingStage below.
    aleph_letter_img: 'assets/aleph.png',
    // Saba reveal — Granddad walks in, waves, holds (no loop). Background
    // pre-corrected to pure white and audio stripped; see saba-reveal
    // frame/case below for how it layers behind the word.
    saba_wave_video: 'assets/saba-wave-compressed.mp4',
    // "Level complete" sting — tune + light clapping, ~6s, plays once the
    // instant this slide loads (the tap that gets here is a real user
    // gesture, so autoplay-with-sound is allowed). Confetti timing is
    // separate/later — see buildSabaRevealStage.
    saba_level_complete_sound: 'assets/level-complete.MP3',
    // Kana reveal — the boy walks in from the side (profile), turns to
    // face forward, and settles holding the teddy bear + shopping bag
    // ("bought" — קָנָה). 5s, white background, downscaled + audio
    // stripped (same treatment as saba-wave-compressed.mp4 above — the
    // original export was portrait 900x1024 at ~3MB; this is 640x728 at
    // ~290KB, same visual quality). See kana-reveal frame/buildDeck below
    // for the confetti timing measured against this specific clip (a
    // left-edge object-position was tried here too, to echo Saba's
    // walk-in, but at this clip's letterbox width it pushed the boy under
    // the letter boxes and hid the teddy bear — Noam: revert. Left
    // centered, same as Saba).
    kana_video: 'assets/kana.mp4',

    // ---------------------------------------------------------------------
    // CHAPTER 2 — Ka + Na -> Kana (קָנָה, "bought"), part of the full-lesson
    // sentence Saba Kana Para ("Grandfather bought a cow"). Same asset
    // conventions as chapter 1 above.
    // ---------------------------------------------------------------------
    ka_character:    'assets/ka-karnaf-c.png',
    karnaf_picture:  'assets/ka-karnaf-i.png',
    na_character:    'assets/na-nahash-c.png',
    nahash_picture:  'assets/na-nahash-i.png',
    ka_letter_img:   'assets/kof-kamatz.png',
    na_letter_img:   'assets/nun-kamatz.png',
    // Silent He — קנה is spelled Qof-Nun-He, with the He carrying no sound
    // of its own and no niqqud, same grammatical role Aleph played at the
    // end of Saba (see LETTERS.he below). Shape confirmed fine on
    // inspection — an earlier QA pass flagged this as looking like a Nun
    // instead of He, but that was a compositing bug in the comparison
    // script, not a real problem with this asset.
    he_letter_img:   'assets/he.png',

    // ---------------------------------------------------------------------
    // CHAPTER 3 — Pa + Ra -> Para (פָּרָה, "cow"), completing the full-lesson
    // sentence Saba Kana Para ("Grandfather bought a cow"). Same asset
    // conventions as chapters 1-2 above.
    // ---------------------------------------------------------------------
    pa_character:   'assets/pa-parpar-c.png',
    parpar_picture: 'assets/pa-parpar-i.png',
    ra_character:   'assets/ra-rakevet-c.png',
    rakevet_picture: 'assets/ra-rakevet-i.png',
    pa_letter_img:  'assets/pe-kamatz-dgsh.png',
    ra_letter_img:  'assets/reish-kamatz.png',
    // Para reuses the same silent He as Kana (LETTERS.he) — פרה is spelled
    // Pe-Resh-He, He again carrying no sound/niqqud of its own.
    //
    // Para reveal — the cow stands still (idle blink/tail-swish/bell-sway,
    // no walk-in arc like Saba/Kana's clips), so there's no "arrival" beat
    // to sync confetti to — see confettiAt in buildDeck below. 5s,
    // downscaled + audio stripped, same treatment as the other two reveal
    // clips (original was 1176x784 at ~1.4MB; this is 960x640 at ~245KB).
    para_video: 'assets/para.mp4',
    // Final full-sentence celebration ("סַבָּא קָנָה פָּרָה" — Granddad bought a
    // cow), played after the sentence-reading round below. Noam is making
    // this clip separately and will drop it in later — filename agreed on
    // ahead of time so wiring it in later is just adding the file, no code
    // change. Falls back gracefully (see buildFinalRevealStage) if the file
    // isn't there yet: no video element renders, sound/confetti still fire.
    sentence_reveal_video: 'assets/saba-kana-para.mp4',
  };

  // ---------------------------------------------------------------------
  // 2) LETTERS — PLACEHOLDER element breakdowns below (marked EDIT ME).
  //    Swap in the real Sal / Bakbuk elements any time — any number of
  //    elements works (2, 3, or 4), no code changes needed.
  //
  //    Each element is a TRANSPARENT overlay PNG (just the red-circle
  //    marker) sized/registered to sit exactly on top of the picture (round 1)
  //    or the faded picture + character (round 2 re-drill) below it.
  //
  //    `origin`: the "x% y%" point (as measured across that element PNG's
  //    own canvas) to scale the pop-in animation from — the center of the
  //    visible red mark, not the center of the mostly-transparent canvas.
  //    Precomputed from the actual file (measured, not detected live in the
  //    browser). Recompute this any time that element's PNG is replaced.
  // ---------------------------------------------------------------------
  const LETTERS = {
    sa: {
      id: 'sa',
      name: 'Sa',
      characterImg: ASSETS.sa_character,
      pictureImg: ASSETS.sal_picture,
      pictureName: 'Sal',
      letterImg: ASSETS.sa_letter_img,
      elements: [
        { id: 'ring', overlayImg: 'assets/sa-sal-e1.png', label: 'This is the ring', origin: '37% 58%' },
        { id: 'net',  overlayImg: 'assets/sa-sal-e2.png', label: 'This is the net',  origin: '37% 77%' },
      ],
    },
    ba: {
      id: 'ba',
      name: 'Ba',
      characterImg: ASSETS.ba_character,
      pictureImg: ASSETS.bakbuk_picture,
      pictureName: 'Bakbuk',
      letterImg: ASSETS.ba_letter_img,
      // Saba (סבא) is spelled Samech-Bet-Aleph — the silent Aleph always
      // rides along with Ba's letter-image in the letters round (see
      // buildReadingStage's companion-letter handling below). Read
      // generically off whichever letter is in the "left/second" slot, so
      // the same code path also carries chapter 2's Na -> He.
      silentCompanion: 'aleph',
      elements: [ // EDIT ME — placeholder bottle elements + placeholder origins
        { id: 'neck', overlayImg: 'assets/ba-bakbuk-e1.png', label: 'This is the neck', origin: '50% 50%' },
        { id: 'body', overlayImg: 'assets/ba-bakbuk-e2.png', label: 'This is the body', origin: '50% 50%' },
        { id: 'base', overlayImg: 'assets/ba-bakbuk-e3.png', label: 'This is the base', origin: '50% 50%' },
      ],
    },
    // Not a taught letter — a minimal entry so the silent Aleph can reuse
    // the same letterId-keyed measurement caches (getLetterWindow/
    // letterMetrics) as sa/ba below. Only .letterImg is ever read for it.
    // hasNiqqud: false is documentation, not (yet) branched on in code —
    // it flags that this letter's vertical position is pinned to its
    // companion letter's canvas origin (see buildReadingStage) rather
    // than the usual kamatz-ink-bottom baseline, because it has no niqqud
    // of its own to zero against. Future silent letters (He, etc. — per
    // Noam, many Hebrew words end in a silent letter shown without
    // niqqud) should follow the same pattern.
    aleph: {
      id: 'aleph',
      hasNiqqud: false,
      letterImg: ASSETS.aleph_letter_img,
    },

    // -----------------------------------------------------------------
    // CHAPTER 2 — Ka + Na -> Kana. Element labels/origins below were
    // measured directly off the actual artwork (same ink-bbox approach
    // the app itself uses), not guessed — but the LABELS (what to call
    // each marked part) are my best reading of the drawing, same spirit
    // as Ba's placeholder breakdown above: happy to correct against
    // Noam's actual intended breakdown.
    // -----------------------------------------------------------------
    ka: {
      id: 'ka',
      name: 'Ka',
      characterImg: ASSETS.ka_character,
      pictureImg: ASSETS.karnaf_picture,
      pictureName: 'Karnaf',
      letterImg: ASSETS.ka_letter_img,
      elements: [
        { id: 'horn-big',   overlayImg: 'assets/ka-karnaf-e1.png', label: 'This is the big horn',   origin: '81% 33%' },
        { id: 'horn-small', overlayImg: 'assets/ka-karnaf-e2.png', label: 'This is the small horn', origin: '76% 45%' },
        { id: 'nose',       overlayImg: 'assets/ka-karnaf-e3.png', label: 'This is the nose',       origin: '88% 53%' },
      ],
    },
    na: {
      id: 'na',
      name: 'Na',
      characterImg: ASSETS.na_character,
      pictureImg: ASSETS.nahash_picture,
      pictureName: 'Nachash',
      letterImg: ASSETS.na_letter_img,
      // Kana (קנה) ends in a silent He — same role Aleph played for Saba.
      silentCompanion: 'he',
      elements: [
        { id: 'body',   overlayImg: 'assets/na-nahash-e1.png', label: 'This is the body',   origin: '51% 40%' },
        { id: 'tongue', overlayImg: 'assets/na-nahash-e2.png', label: 'This is the tongue', origin: '56% 79%' },
      ],
    },
    // Silent He — shared by both Kana and Para (both end in He). See
    // ASSETS.he_letter_img's comment: shape confirmed fine, no issue.
    he: {
      id: 'he',
      hasNiqqud: false,
      letterImg: ASSETS.he_letter_img,
    },

    // -----------------------------------------------------------------
    // CHAPTER 3 — Pa + Ra -> Para. Same as chapter 2's note: element
    // labels/origins measured directly off the actual artwork (ink-bbox
    // of each overlay, and of that overlay composited onto the picture to
    // confirm which body part it lands on), labels are my best reading —
    // happy to correct against Noam's intended breakdown.
    // -----------------------------------------------------------------
    pa: {
      id: 'pa',
      name: 'Pa',
      characterImg: ASSETS.pa_character,
      pictureImg: ASSETS.parpar_picture,
      pictureName: 'Parpar',
      letterImg: ASSETS.pa_letter_img,
      elements: [
        { id: 'wing', overlayImg: 'assets/pa-parpar-e1.png', label: 'This is the wing', origin: '69% 35%' },
        { id: 'eye',  overlayImg: 'assets/pa-parpar-e2.png', label: 'This is the eye',  origin: '72% 28%' },
        { id: 'spot', overlayImg: 'assets/pa-parpar-e3.png', label: 'This is the spot', origin: '70% 70%' },
      ],
    },
    ra: {
      id: 'ra',
      name: 'Ra',
      characterImg: ASSETS.ra_character,
      pictureImg: ASSETS.rakevet_picture,
      pictureName: 'Rakevet',
      letterImg: ASSETS.ra_letter_img,
      // Para (פרה) ends in a silent He — same role Aleph/He played for
      // Saba/Kana. Reuses the SAME LETTERS.he entry (no new asset needed).
      silentCompanion: 'he',
      elements: [
        { id: 'smoke',    overlayImg: 'assets/ra-rakevet-e1.png', label: 'This is the smoke',    origin: '34% 24%' },
        { id: 'chimney',  overlayImg: 'assets/ra-rakevet-e2.png', label: 'This is the chimney',  origin: '42% 44%' },
      ],
    },
  };

  // ---------------------------------------------------------------------
  // 3) CAPTIONS — paste narration/subtitle text per frame id. Empty = silent.
  //    (Frame ids are auto-listed after the deck builds; press "i" to see them live.)
  // ---------------------------------------------------------------------
  const CAPTIONS = {
    // 'sa-character': 'Hi, I\'m Sa!',
  };

  // ---------------------------------------------------------------------
  // 4) MOMENT HOOKS — no-ops in Pass 1. Pass 2 attaches effects here.
  // ---------------------------------------------------------------------
  const MOMENTS = {
    onCorrectAnswerConfirmed(frame) {},
    onCycleComplete(letterId) {},
    onFinalWordRevealed() {},
  };

  // =========================================================================
  // TEMPLATE ENGINE — builds one letter's full teaching cycle from its data.
  // You shouldn't need to edit below this line to change content.
  // =========================================================================

  function buildCycleFrames(L) {
    const frames = [];

    // 1. Reveal character alone + tease hiding spot — ONE frame, one tap
    // ("This is Sa. Sa likes hiding in there…" said together, then tap).
    frames.push({
      id: `${L.id}-character`,
      kind: 'solo-character',
      img: L.characterImg,
      text: `This is ${L.name}. ${L.name} likes hiding in the…`,
    });

    // 2. Reveal picture (no breakdown yet)
    frames.push({
      id: `${L.id}-picture`,
      kind: 'picture-reveal',
      img: L.pictureImg,
      text: `${L.pictureName}!`,
    });

    // 3..n. Anchor each element on the plain picture — CUMULATIVE: every
    // previously-shown element overlay stays on screen, the new one is
    // added on top of it (never replaced).
    const shownOnPicture = [];
    L.elements.forEach((elmt) => {
      shownOnPicture.push(elmt.overlayImg);
      frames.push({
        id: `${L.id}-anchor-${elmt.id}`,
        kind: 'anchor',
        imgs: [L.pictureImg, ...shownOnPicture],
        animateSrc: elmt.overlayImg, // only the element that's new THIS tap pops in
        animateOrigin: elmt.origin,
        text: elmt.label,
      });
    });

    // ROUND 2 (re-drill): the character stays on screen at 100% opacity for
    // the whole round, stacked over the picture faded to 50% — and elements
    // accumulate on top of THAT, the same "everything stays, new thing adds
    // on" rule as round 1. Nothing is ever withheld/blanked; every element
    // gets shown, then a final tap confirms the picture's name.
    const redrillBase = [L.pictureImg, L.characterImg]; // faded picture + character, present for all of round 2
    frames.push({
      id: `${L.id}-redrill-character`,
      kind: 'anchor',
      imgs: [...redrillBase],
      fadeBase: true,
      text: `${L.name}!`,
    });

    const shownInRedrill = [];
    L.elements.forEach((elmt) => {
      shownInRedrill.push(elmt.overlayImg);
      frames.push({
        id: `${L.id}-redrill-${elmt.id}`,
        kind: 'anchor',
        imgs: [...redrillBase, ...shownInRedrill],
        fadeBase: true,
        animateSrc: elmt.overlayImg, // only the element, never the character, pops in
        animateOrigin: elmt.origin,
        text: elmt.label,
      });
    });

    // Confirm the picture's name — back to the full-opacity picture, no
    // character, no element overlays.
    frames.push({
      id: `${L.id}-redrill-answer`,
      kind: 'picture-reveal',
      img: L.pictureImg,
      text: `${L.pictureName}!`,
      moment: 'onCorrectAnswerConfirmed',
    });

    // Cold recall test — same "faded picture + character" look as the
    // re-drill transition, reused as the recall cue, then confirmed with
    // the full-opacity picture again.
    frames.push({
      id: `${L.id}-recall-prompt`,
      kind: 'anchor',
      imgs: [...redrillBase],
      fadeBase: true,
      text: `${L.name} likes hiding in the…?`,
    });
    frames.push({
      id: `${L.id}-recall-answer`,
      kind: 'recall-answer',
      img: L.pictureImg,
      text: `${L.pictureName}!`,
      moment: 'onCorrectAnswerConfirmed',
    });

    // End-of-cycle celebration — plain "Yay!" text, no mascot/decoration (Pass 2 attaches effects later)
    frames.push({
      id: `${L.id}-yay`,
      kind: 'yay',
      text: 'Yay!',
      moment: 'onCycleComplete',
      momentArg: L.id,
    });

    return frames;
  }

  // Phase 2 — "where's it hiding?" reinforcement, done AFTER both letters'
  // full teaching cycles are complete (first letter fully taught, then
  // second, then this). For each letter: the character sits at full
  // opacity over its picture faded to 20% (same look/asset/fade as the
  // in-cycle re-drill — no new images needed), Noam asks live where it
  // hides, then one tap reveals the plain full-opacity picture as the
  // answer. No element overlays here — just the hiding-spot recall.
  // `letterIds` — which two (or more) LETTERS keys to build this for, in
  // order; lets chapter 2 (Ka/Na) reuse this verbatim.
  function buildHidingRecall(letterIds) {
    const frames = [];
    letterIds.map((id) => LETTERS[id]).forEach((L) => {
      frames.push({
        id: `${L.id}-hiding-prompt`,
        kind: 'anchor',
        imgs: [L.pictureImg, L.characterImg],
        fadeBase: true,
        text: `Where does ${L.name} like to hide?`,
      });
      frames.push({
        id: `${L.id}-hiding-answer`,
        kind: 'picture-reveal',
        img: L.pictureImg,
        text: `${L.pictureName}!`,
        moment: 'onCorrectAnswerConfirmed',
      });
    });
    return frames;
  }

  // Phase 3 — reading. Sa and Ba are called by name (character mascots first,
  // then the real Hebrew letters), taking turns: teacher demonstrates once,
  // then the kid does it. Whichever side isn't "active" for a given tap just
  // sits there as a plain, unfaded character/letter — nothing about it
  // changes until it's its turn.
  //
  // Slot shapes (used for both `sa` and `ba` on every reading-pair frame):
  //   { type: 'character', src, letter }       — plain mascot image, cropped
  //                                              through that LETTER's single
  //                                              reading window (see the
  //                                              READING WINDOW comment
  //                                              above computeInkBBoxPixels)
  //   { type: 'composite', base, overlay,      — mascot at full opacity over
  //     letter }                                 its picture faded to 20%,
  //                                              BOTH cropped through that
  //                                              same per-letter window, and
  //                                              rendered as two separately
  //                                              stacked images so the pulse
  //                                              (see buildReadingBox) can
  //                                              animate the character alone
  //                                              without moving the picture
  //   { type: 'letter-image', letter }         — the real Hebrew letter (+
  //                                              niqqud) round: a pre-rendered
  //                                              PNG (Noam's Photoshop file,
  //                                              not live CSS text), shown
  //                                              at its native pixels — no
  //                                              crop, same "use the source
  //                                              as-is" idea as the mascot
  //                                              picture window. Placed via
  //                                              the LETTER-GLYPH window/
  //                                              metrics system (see below,
  //                                              mirrors the mascot one but
  //                                              baseline-anchored on each
  //                                              glyph's kamatz mark instead
  //                                              of ink-centered, per Noam's
  //                                              own reference point).
  //
  // `letter` on image slots is the LETTERS key ('sa' | 'ba' | 'ka' | 'na' |
  // ...) — it selects which reading window (and which READING_CHAR_SCALE
  // nudge) applies.
  //
  // `active`: a LETTERS key | null — which side (if any) pulses this tap.
  // Every reading-pair frame renders right-to-left (right-slot letter on
  // the right, left-slot letter on the left, via .reading-pair's
  // row-reverse) since Hebrew is spelled/read that way — true for the
  // mascot rounds too, not just the letters.
  //
  // Generic over any two letters + an optional silent companion on the
  // left-slot letter (see LETTERS[leftId].silentCompanion) — chapter 1
  // (Sa/Ba/Aleph -> Saba) and chapter 2 (Ka/Na/He -> Kana) both build off
  // this same function. `opts.idPrefix` keeps every frame id chapter 1
  // already shipped with completely unchanged (called with '' below);
  // chapter 2 uses 'kana-' so nothing collides.
  function buildReadingPhase(rightId, leftId, opts) {
    const right = LETTERS[rightId];
    const left = LETTERS[leftId];
    const idPrefix = opts.idPrefix || '';

    const rightCharacter = { type: 'character', src: right.characterImg, letter: rightId };
    const leftCharacter = { type: 'character', src: left.characterImg, letter: leftId };
    const rightComposite = { type: 'composite', base: right.pictureImg, overlay: right.characterImg, letter: rightId };
    const leftComposite = { type: 'composite', base: left.pictureImg, overlay: left.characterImg, letter: leftId };
    const rightLetter = { type: 'letter-image', letter: rightId };
    const leftLetter = { type: 'letter-image', letter: leftId };

    return [
      // Round 1 — teacher demonstrates each name in turn.
      { id: `${idPrefix}reading-intro`, kind: 'reading-pair', sa: rightCharacter, ba: leftCharacter, active: null,
        text: 'Let’s call them by their names, one at a time. I’ll go first.' },
      { id: `${idPrefix}reading-demo-${rightId}`, kind: 'reading-pair', sa: rightComposite, ba: leftCharacter, active: rightId,
        text: `${right.name}!` },
      { id: `${idPrefix}reading-demo-${leftId}`, kind: 'reading-pair', sa: rightCharacter, ba: leftComposite, active: leftId,
        text: `${left.name}!` },

      // Round 2 — same visuals, kid's turn (silent prompts).
      { id: `${idPrefix}reading-your-turn`, kind: 'reading-pair', sa: rightCharacter, ba: leftCharacter, active: null,
        text: 'Now it’s your turn.' },
      { id: `${idPrefix}reading-kid-${rightId}`, kind: 'reading-pair', sa: rightComposite, ba: leftCharacter, active: rightId,
        text: '' },
      { id: `${idPrefix}reading-kid-${leftId}`, kind: 'reading-pair', sa: rightCharacter, ba: leftComposite, active: leftId,
        text: '' },

      // Round 3 — same drill, now with the real letters (gap between them).
      { id: `${idPrefix}reading-letters-intro`, kind: 'reading-pair', sa: rightLetter, ba: leftLetter, active: null,
        text: 'Again!' },
      { id: `${idPrefix}reading-letters-${rightId}`, kind: 'reading-pair', sa: rightLetter, ba: leftLetter, active: rightId,
        text: `${right.name}!` },
      { id: `${idPrefix}reading-letters-${leftId}`, kind: 'reading-pair', sa: rightLetter, ba: leftLetter, active: leftId,
        text: `${left.name}!` },
      { id: `${idPrefix}reading-letters-combine`, kind: 'reading-pair', sa: rightLetter, ba: leftLetter, active: null,
        text: 'What did we get?' },

      // Final reveal — same word, same geometry as reading-letters-combine
      // (built via buildReadingStage so it doesn't jump on this tap), with
      // a clip layered in behind it. frame.text is reference-only, same
      // convention as the teaching-cycle frames above. `kind: 'word-reveal'`
      // is the generic name (see buildWordRevealStage) — reused verbatim
      // by every chapter's reveal, not specific to Saba despite the
      // function's historical name.
      { id: opts.revealId, kind: 'word-reveal', sa: rightLetter, ba: leftLetter,
        video: opts.video, sound: opts.sound, confettiAt: opts.confettiAt,
        videoPosition: opts.videoPosition,
        text: opts.word, moment: 'onFinalWordRevealed' },
    ];
  }

  // FINAL SENTENCE ROUND — the capstone after all three chapters: the whole
  // taught sentence "סַבָּא קָנָה פָּרָה" (Grandfather bought a cow) sits still on
  // screen first, then each tap pulses the next taught letter in reading
  // order (Sa, Ba, Ka, Na, Pa, Ra — the exact order each was first taught),
  // one at a time, so the child calls out each letter they already know
  // inside the full sentence — same attention cue used throughout this
  // whole deck (see .reading-box--pulse), no new interaction language.
  // Ends on the same still sentence once more, then the final celebration.
  function buildFinalSentencePhase() {
    const pulseOrder = ['sa', 'ba', 'ka', 'na', 'pa', 'ra'];
    return [
      { id: 'sentence-intro', kind: 'sentence-reading', active: null,
        text: 'סַבָּא קָנָה פָּרָה' },
      ...pulseOrder.map((id) => ({
        id: `sentence-pulse-${id}`, kind: 'sentence-reading', active: id,
        text: `${LETTERS[id].name}!`,
      })),
      { id: 'sentence-outro', kind: 'sentence-reading', active: null,
        text: 'סַבָּא קָנָה פָּרָה' },
      { id: 'sentence-reveal', kind: 'sentence-reveal',
        video: ASSETS.sentence_reveal_video, sound: ASSETS.saba_level_complete_sound,
        confettiAt: 1.0, text: 'סַבָּא קָנָה פָּרָה' },
    ];
  }

  function buildDeck() {
    return [
      // Chapter 1 — Sa + Ba -> Saba ("grandfather").
      ...buildCycleFrames(LETTERS.sa),
      ...buildCycleFrames(LETTERS.ba),
      ...buildHidingRecall(['sa', 'ba']),
      ...buildReadingPhase('sa', 'ba', {
        idPrefix: '', revealId: 'saba-reveal',
        video: ASSETS.saba_wave_video, sound: ASSETS.saba_level_complete_sound,
        word: 'סַבָּא',
      }),

      // Chapter 2 — Ka + Na -> Kana ("bought"). Same level-complete sting
      // reused from chapter 1 (no separate clip for this chapter).
      ...buildCycleFrames(LETTERS.ka),
      ...buildCycleFrames(LETTERS.na),
      ...buildHidingRecall(['ka', 'na']),
      ...buildReadingPhase('ka', 'na', {
        idPrefix: 'kana-', revealId: 'kana-reveal',
        video: ASSETS.kana_video, sound: ASSETS.saba_level_complete_sound,
        // Measured directly from kana.mp4 (5s total): he's mid-stride/
        // still turning through ~1.8s, feet planted and fully settled
        // facing forward by ~1.9-2.0s — firing here lands the burst right
        // as he "arrives", same idea as Saba's arm-lift trigger below.
        confettiAt: 2.0,
        // kana.mp4 is portrait (900x1024) inside a landscape stage, so
        // object-fit:contain letterboxes it with empty gutters left and
        // right of center. Tried pulling it toward the left edge (to echo
        // how Saba's wide clip visually enters from screen-left) but at
        // this letterbox width that pushed the boy under the letter boxes
        // rendered on top, hiding the teddy bear the kids are meant to
        // see — Noam: push it back. Left at the default centered position
        // (no videoPosition set — see buildSabaRevealStage's '50% center'
        // fallback for any frame that doesn't set one).
        word: 'קָנָה',
      }),

      // Chapter 3 — Pa + Ra -> Para ("cow"), completing the lesson sentence
      // Saba Kana Para. Same level-complete sting reused again.
      ...buildCycleFrames(LETTERS.pa),
      ...buildCycleFrames(LETTERS.ra),
      ...buildHidingRecall(['pa', 'ra']),
      ...buildReadingPhase('pa', 'ra', {
        idPrefix: 'para-', revealId: 'para-reveal',
        video: ASSETS.para_video, sound: ASSETS.saba_level_complete_sound,
        // para.mp4's cow is already settled in an idle pose for the whole
        // clip (blink/tail-swish/bell-sway, no walk-in arc to sync to
        // unlike Saba/Kana) — firing shortly after the clip starts is
        // enough for the reveal to register before celebrating.
        confettiAt: 1.0,
        word: 'פָּרָה',
      }),

      // Chapter 4 — the capstone: read all three taught words together as
      // the actual sentence they spell, "סַבָּא קָנָה פָּרָה" (Grandfather bought
      // a cow). Noam: "the child should be able to recognize the letters in
      // front of him" — see buildFinalSentencePhase.
      ...buildFinalSentencePhase(),
    ];
  }

  // =========================================================================
  // RENDER ENGINE
  // =========================================================================

  const frames = buildDeck();
  // Auto-fill any caption not explicitly set, so CAPTIONS always has every id.
  frames.forEach((f) => { if (!(f.id in CAPTIONS)) CAPTIONS[f.id] = ''; });

  // Preload every image referenced anywhere in the deck up front, so the
  // browser already has each one decoded/cached by the time a tap reaches
  // it — this is what removes the jump/stutter on first visit to a slide.
  // Also cache each image's natural width/height as soon as it's known, so
  // the stage can be sized correctly on the very first paint instead of
  // waiting for an onload — this is what keeps size/position locked across
  // every slide instead of momentarily snapping to a fallback box.
  const imageDims = new Map();

  // READING WINDOW — ONE crop window per LETTER, shared by every
  // reading-phase state of that letter.
  //
  // Why one window, not two: a reading-pair slot shows the same letter's
  // character in two states across consecutive taps — plain-alone, and
  // composited over its own faded picture. The two hard requirements are
  // (a) Sa's and Ba's plain characters read as a matched pair (similar
  // size, both centered on the same baseline), and (b) a character is
  // PIXEL-IDENTICAL the moment its picture appears behind it or disappears
  // from behind it — no size or position jump at all. (b) forces both
  // states to be cropped through the exact same window (any two different
  // windows re-map the character differently — that mismatch IS the jump
  // this deck kept trading back and forth). The full-picture requirement
  // pins down the window itself, and (a) is solved by BOX PLACEMENT, not
  // by the window (see below). So:
  //
  //   window(L) = the picture's own full native canvas — centered on the
  //               canvas center (W/2, H/2), size = max(W, H)
  //   (W × H read off the actual loaded picture; for the project's square
  //   700×700 assets this is exactly "no crop at all, use the source
  //   as-is".)
  //
  // FULL PICTURE, GUARANTEED — and with ZERO invented padding: the window
  // IS the picture's own bounds, so the whole Sal/Bakbuk (Noam's memory
  // cue) is trivially, entirely inside it, and not one transparent pixel
  // is added around it. An earlier version instead used a square centered
  // on the CHARACTER's ink with half-size = max(cx, W-cx, cy, H-cy) —
  // that also guaranteed the full picture, but because that half-size is
  // one scalar applied in all four directions from the character, it
  // padded the same large distance on the sides where the picture doesn't
  // actually extend (e.g. ~180px of pure transparency on Sa's inner side,
  // ~880px windows for both letters). Each character then sat dead-center
  // of a mostly-empty square, and since boxes were laid edge-to-edge, all
  // that empty margin pushed the two CHARACTERS far apart on screen even
  // with a small box gap — the exact "they drifted apart" complaint this
  // version fixes.
  //
  // The plain slot crops the character through window(L). The composite
  // crops BOTH its base picture and its character overlay through the very
  // same window(L) — same window in, same registration out, so the "hides
  // inside the picture" alignment is exactly preserved (relative geometry
  // between character and picture is untouched; only the framing of the
  // pair changes). The plain character and the composite's overlay are in
  // fact the SAME cache entry — literally one data URL — so state switches
  // cannot change the character even in principle; the only thing a switch
  // does is add/remove the faded picture underneath it.
  //
  // THE PAIRING (and the closeness) is solved by BOX PLACEMENT: the
  // character no longer sits at its window's center — it sits wherever
  // the artist actually drew it, and its exact position within the window
  // is measured once (readingMetricsCache). buildReadingStage then places
  // and sizes each letter's box FROM those measurements so that, on
  // screen: both characters' ink renders at the same size (one shared
  // px-per-ink-px scale K), both characters' ink centers sit on the same
  // horizontal line, and the horizontal gap between the two characters'
  // FACING INK EDGES is exactly READING_CHAR_GAP_FRACTION of the screen —
  // measured character-to-character, which is the distance the eye (and
  // Noam) actually perceives, not box-edge-to-box-edge. All of it is
  // computed off per-letter constants, never off which state a slot is in,
  // so nothing can move across a reveal tap. See buildReadingStage.
  //
  // A consequence handled explicitly: with real (asymmetric) compositions
  // and the characters pulled close, the two boxes now OVERLAP a little —
  // a composite's full picture can extend behind the neighbouring plain
  // character. That's fine and intended (the picture is a 20%-opacity
  // backdrop), but stacking order matters: buildReadingStage gives
  // composite boxes a LOWER z-index than plain/text boxes, so a faded
  // picture always passes BEHIND the neighbour's full-opacity character,
  // never tints over it.
  //
  // TUNING (all safe to change freely — none can crop a picture or
  // reintroduce a reveal jump):
  //   READING_CHAR_GAP_FRACTION — the gap between the two characters'
  //     facing ink edges, as a fraction of screen width. THE closeness
  //     knob. Lower = closer (pictures pass further behind each other),
  //     higher = further apart.
  //   READING_STAGE_WIDTH_FRACTION / READING_STAGE_HEIGHT_FRACTION (further
  //     down, by the other layout constants) — how much of the screen the
  //     mascot pair may use. Raising them makes everything (characters +
  //     full pictures) proportionally bigger.
  //   READING_CHAR_SCALE — optional per-letter nudge (scales that letter's
  //     whole box, i.e. its character AND its full picture together) if the
  //     automatic ink-bbox match still leaves the pair looking uneven to
  //     the eye — same spirit as the hand-set `origin` constants on anchor
  //     elements. Because it scales the plain and composite states
  //     identically, it can never reintroduce a reveal jump, and because
  //     it scales the box rather than the crop, it can never cut off the
  //     picture.
  //
  // PULSE ORIGIN: with the character no longer at the window's center, the
  // pulse must not scale about the box center (that would sweep the
  // character sideways — the old arrow-era drift). buildReadingBox sets
  // each character/overlay img's transform-origin to the character's
  // measured ink center within the window, so the pulse expands in place
  // in both states, exactly as before.
  //
  // This deck runs over https via GitHub Pages, where reading pixel data
  // back out of a same-origin canvas is allowed, so the ink bounds can be
  // detected automatically instead of hand-tuned per asset.
  const READING_CHAR_SCALE = { sa: 1, ba: 1, ka: 0.55, na: 0.55 }; // per-letter hand nudge, edit freely (missing keys default to 1 — see buildReadingStage). Ka and Na are both scaled down together (same value) so their on-screen ink height stays equal (on-screen ink height = K * SCALE_letter, independent of that letter's own ink-to-canvas ratio — equal SCALE values is what keeps the two characters reading as "the same size" to a child, which matters more here than their boxes/full-picture canvases matching in footprint; Noam: boxes/pictures differing in size is fine, the characters must not). 0.55 was chosen to match Ka's already-approved on-screen size after the pair-spacing fix; Na was brought down to meet it.
  // Per-PAIR nudges for the mascot ("character") round only, keyed by
  // "rightId|leftId" — for when the automatic ink-edge gap (always exactly
  // READING_CHAR_GAP_FRACTION, provably, regardless of source art) still
  // reads as too tight or off-center for a specific pair. This happens with
  // thin single-stroke sketches (Ka/Na) in a way it didn't for Sa/Ba's
  // fuller mascot art: each letter's ink sits at a different position
  // *within its own canvas*, so centering the two full canvases doesn't
  // reliably center the two letters' actual visible ink. Missing keys
  // default to 0 (no change) — Sa/Ba's pair key was never added, so their
  // approved geometry is untouched.
  // Per-letter horizontal nudge for the ENTIRE per-letter story loop
  // (buildCycleFrames' `${id}-character`, `${id}-picture`, every
  // `${id}-anchor-*`/`${id}-redrill-*` frame, and the recall prompt/answer
  // pair — every frame whose id starts with this letter and renders
  // through buildCompositeStage). Each of these frames centers its own
  // PNG's full 700x700 canvas on screen; for Sa/Ba/Na the ink happens to
  // sit close enough to the canvas's own horizontal middle that this reads
  // as centered, but Ka's sketch sits far over to one side of ITS canvas
  // (ink bbox center at ~82% of canvas width), so centering the canvas
  // leaves Ka visibly off-center on screen. Fraction is of the stage's own
  // rendered width, computed from each PNG's real ink bbox (Python/PIL,
  // alpha>10 threshold) so it scales correctly at any screen size.
  //
  // CORE INVARIANT — do not apply this to only some of a letter's frames:
  // the character sketch shown alone in `${id}-character` is the SAME ink
  // shape hand-registered into the full picture (e.g. Ka's two strokes
  // ARE the rhino's ear + horn in karnaf_picture) — Noam: "Ka, the
  // character, and the picture are always perfectly aligned pixel to
  // pixel." Both PNGs share one canvas/registration, so identical
  // block-centering keeps them aligned automatically; shifting only one
  // of them (as an earlier pass here mistakenly did, only touching
  // solo-character) breaks that alignment the instant the picture reveals.
  // Applied as one shared step in renderFrame (search
  // applyStoryLoopCenterShift) so every current and future frame kind that
  // goes through buildCompositeStage picks it up automatically — adding a
  // letter here is enough, no per-case wiring needed or to remember.
  //
  // Pa/Ra measured the same way ahead of time (Noam asked to keep centering
  // consistent from the start rather than fix it after the fact like Ka/Na
  // needed): Pa's wing-sketch ink bbox center sits at 69% of its canvas
  // width, Ra's smoke-sketch at 34% — both meaningfully off-center (in the
  // same range that got Ka fixed), so both get a shift here: -0.19 for Pa,
  // +0.16 for Ra. Formula is just shift = 0.5 - (ink_center / canvas_width)
  // for whichever direction reduces that letter's own deviation to ~0.
  const STORY_LOOP_CENTER_SHIFT = { ka: -0.32, na: -0.02, pa: -0.19, ra: 0.16 };
  const READING_CHAR_GAP_EXTRA = { 'ka|na': 0.03, 'pa|ra': 0.03 }; // extra gap fraction, added on top of READING_CHAR_GAP_FRACTION, between a pair's facing ink edges — Noam: spread them apart more so the eye can land on each one separately. Measured: Pa/Ra's default (unextended) gap is pixel-identical to Sa/Ba's own default gap (both ~66.7px on a 1333px-wide stage — this constant guarantees an absolute-pixel gap regardless of which letters are in play), yet Noam still read it as tighter than the Ka/Na and Sa/Ba reference screenshots he sent — Pa's wing and Ra's smoke shapes apparently read as visually "closer" than their ink bounding boxes are. Reusing Ka/Na's exact extra (rather than inventing a new number) keeps the two "spread" pairs consistent with each other, per Noam's own "consistency always" note elsewhere in this session. The pair stays centered regardless of this value — shiftX below always re-centers the union of the boxes after the gap is applied, so widening the gap can't push the pair off-center.
  const READING_CHAR_CENTER_SHIFT = { 'ka|na': -0.075 }; // fraction of screen width to shift the whole Ka+Na pair left — Noam: treat the LETTERS round as "zero" and land the characters as close to that same spot as possible, so the transition from character to letter reads as the same object, not a jump. Measured off Noam's own overlay comparison (characters screenshot laid over the letters screenshot): Ka's ink wanted to move left by more than Na's, so this is the average of the two — an exact match isn't possible with one shared shift (per Noam: doesn't need to land on the pixel).
  // fraction of screen height to shift a pair DOWN, same "land on the
  // letters" reasoning as the horizontal shift above, just on the Y axis.
  // Missing keys default to 0 — Sa/Ba never needed this and stay
  // untouched. Pa/Ra's natural y0 (no shift) measured at ~273px on a
  // 781px-tall stage vs. Sa/Ba's and Ka/Na's own y0 landing at ~397px —
  // Noam: bring Pa/Ra down to sit where the other two pairs already do.
  // (273 + 0.16*781 ≈ 398, matching). If the picture underneath ends up
  // partly clipped by the stage edge at this position, that's fine, per
  // Noam — the shift is the fix, not a smaller/cropped image.
  const READING_CHAR_VERTICAL_SHIFT = { 'ka|na': 0.06, 'pa|ra': 0.16 };
  // letterId -> measurements of where that letter's character sits within
  // its window, taken off the real pixels when the window is computed (see
  // getReadingWindow). All in window coordinates:
  //   size          window canvas size
  //   ink           character ink bbox longest side
  //   cx, cy        character ink center
  //   left, right   character ink bbox min/max X
  // buildReadingStage reads this synchronously to place/size each box, and
  // buildReadingBox reads it for the pulse's transform-origin.
  const readingMetricsCache = new Map();
  function readingMetrics(letterId) {
    return readingMetricsCache.get(letterId) || null;
  }
  // Sets a character/overlay img's pulse transform-origin to the
  // character's measured ink center (the character is NOT at the window
  // center anymore, so the default center origin would sweep it sideways
  // while pulsing). Metrics are warm from page load in practice; the
  // promise fallback covers the first moments after boot.
  function applyCharPulseOrigin(imgEl, letterId) {
    const set = (m) => {
      if (m) imgEl.style.transformOrigin = `${(m.cx / m.size) * 100}% ${(m.cy / m.size) * 100}%`;
    };
    const m = readingMetrics(letterId);
    if (m) set(m);
    else getReadingWindow(letterId).then(() => set(readingMetrics(letterId)));
  }
  function computeInkBBoxPixels(imgEl) {
    try {
      const w = imgEl.naturalWidth, h = imgEl.naturalHeight;
      if (!w || !h) return null;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(imgEl, 0, 0);
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
      const step = 2; // every other pixel — plenty precise for this, much faster
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          if (data[(y * w + x) * 4 + 3] > 10) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) return null;
      return { minX, minY, maxX, maxY };
    } catch (e) {
      return null; // canvas blocked for some reason — falls back to unadjusted rendering
    }
  }
  function loadImageForCrop(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }
  function cropImageToWindow(img, win) {
    if (!img || !win) return null;
    const canvas = document.createElement('canvas');
    canvas.width = win.canvasSize;
    canvas.height = win.canvasSize;
    const ctx = canvas.getContext('2d');
    try {
      // Source rectangle is centered on the window's own center; any part of
      // it that falls outside the original image's bounds is simply left
      // transparent by drawImage — exactly the padding we want.
      ctx.drawImage(img, win.cx - win.canvasSize / 2, win.cy - win.canvasSize / 2, win.canvasSize, win.canvasSize, 0, 0, win.canvasSize, win.canvasSize);
      return canvas.toDataURL();
    } catch (e) {
      return null; // tainted canvas or similar — falls back to unadjusted rendering
    }
  }

  // CROP CACHES — ONE window per LETTER, one cropped data URL per
  // (letter, image) pair. A letter's plain character and its composite
  // overlay resolve to the SAME pair, so they share one cache entry —
  // pixel-identity between the two states is structural, not a coincidence
  // of matching math.
  // Guards the "measurements not ready yet, re-render once they land"
  // fallback paths in buildReadingStage below: without this, a genuinely
  // failed measurement (e.g. a missing/broken image asset — 404, bad path)
  // resolves its cache promise to null forever, and re-rendering on an
  // already-resolved promise fires its .then() as an immediate microtask —
  // with no real async gap, that becomes an infinite same-tick render loop
  // that freezes the tab. Each frame gets exactly one retry; if metrics
  // still aren't there after that, it just keeps the fallback layout.
  const readingRetriedFrames = new Set(); // frame id -> already retried once
  const readingWindowCache = new Map(); // letterId -> Promise<window|null>
  function getReadingWindow(letterId) {
    if (!readingWindowCache.has(letterId)) {
      const L = LETTERS[letterId];
      readingWindowCache.set(letterId, Promise.all([
        loadImageForCrop(L.characterImg),
        loadImageForCrop(L.pictureImg),
      ]).then(([charImg, picImg]) => {
        if (!charImg) return null;
        const bbox = computeInkBBoxPixels(charImg);
        if (!bbox) return null;
        // The window IS the picture's own canvas (see the READING WINDOW
        // comment): centered on the canvas center, sized to its longest
        // side — for the project's square assets, literally "no crop".
        // Canvas dims are read off the actually-loaded picture, falling
        // back to the character's canvas (same coordinate space per the
        // project's asset convention) if the picture file is missing.
        const ref = picImg || charImg;
        const W = ref.naturalWidth, H = ref.naturalHeight;
        const canvasSize = Math.max(1, Math.max(W, H));
        const cx = W / 2, cy = H / 2;
        // Character position measurements, published in WINDOW coordinates
        // for buildReadingStage / applyCharPulseOrigin (for square assets
        // the offsets are zero and window coords == source coords).
        const offX = (canvasSize - W) / 2;
        const offY = (canvasSize - H) / 2;
        readingMetricsCache.set(letterId, {
          size: canvasSize,
          ink: Math.max(bbox.maxX - bbox.minX, bbox.maxY - bbox.minY) || 1,
          cx: (bbox.minX + bbox.maxX) / 2 + offX,
          cy: (bbox.minY + bbox.maxY) / 2 + offY,
          left: bbox.minX + offX,
          right: bbox.maxX + offX,
        });
        return { cx, cy, canvasSize };
      }));
    }
    return readingWindowCache.get(letterId);
  }
  const croppedImageCache = new Map(); // "letterId|imgSrc" -> Promise<dataURL|null>
  function getReadingCroppedImage(letterId, imgSrc) {
    const key = `${letterId}|${imgSrc}`;
    if (!croppedImageCache.has(key)) {
      croppedImageCache.set(key, Promise.all([getReadingWindow(letterId), loadImageForCrop(imgSrc)])
        .then(([win, img]) => cropImageToWindow(img, win)));
    }
    return croppedImageCache.get(key);
  }
  // Fills an already-in-the-DOM <img> once its cropped version is ready.
  // Nothing shifts when this resolves — the img has no content until then,
  // so there's no "before" state to jump from. If the crop pipeline fails
  // (missing file, blocked canvas), falls back to the raw uncropped src so
  // the slot is never left blank.
  function applyReadingCrop(imgEl, spec, imgSrc) {
    getReadingCroppedImage(spec.letter, imgSrc).then((dataUrl) => {
      imgEl.src = dataUrl || imgSrc;
    });
  }

  // LETTER-GLYPH WINDOW/METRICS — the real-letters round's own measurement
  // system, deliberately kept SEPARATE from readingWindowCache/
  // readingMetricsCache above (different Maps, different functions) so
  // nothing here can ever touch or regress the proven mascot pipeline.
  //
  // These are pre-rendered PNGs (Noam's Photoshop file, Noto Sans Hebrew),
  // one letter + its niqqud baked into one flat image, all on the same
  // 700x700 canvas (his own convention, built to match this deck's
  // "consistent canvas size, ink found automatically" pattern). There's
  // only one image per letter here — no separate "picture" to guarantee
  // full display of — so the window is trivially the glyph's own full
  // native canvas: same "no crop, ever" idea as the mascot picture window,
  // just with nothing else to compare it to.
  //
  // The reference point is NOT the ink center (unlike the mascot system):
  // Noam built every glyph file around a fixed vertical anchor — the kamatz
  // mark sits at the same relative spot in every file — and said so
  // directly: "my point of reference is the kamatz sign, that will be the
  // zero." Measuring the combined ink bbox (letter + kamatz together, since
  // they're both just non-transparent pixels in one flat file) and using
  // its BOTTOM edge as the shared baseline is what actually honors that:
  // it lets a tall letter (Lamed's ascender) and a short one sit on the
  // same line while still reflecting their real, different heights, the
  // same way printed Hebrew text uses a baseline.
  const letterMetricsCache = new Map(); // letterId -> { size, cx, top, bottom, left, right }
  const letterWindowCache = new Map();  // letterId -> Promise (resolved once measured)
  function getLetterWindow(letterId) {
    if (!letterWindowCache.has(letterId)) {
      const L = LETTERS[letterId];
      letterWindowCache.set(letterId, loadImageForCrop(L.letterImg).then((img) => {
        if (!img) return null;
        const bbox = computeInkBBoxPixels(img);
        if (!bbox) return null;
        const size = Math.max(1, Math.max(img.naturalWidth, img.naturalHeight));
        letterMetricsCache.set(letterId, {
          size,
          top: bbox.minY,
          bottom: bbox.maxY,
          cx: (bbox.minX + bbox.maxX) / 2,
          left: bbox.minX,
          right: bbox.maxX,
        });
        return true;
      }));
    }
    return letterWindowCache.get(letterId);
  }
  function letterMetrics(letterId) {
    return letterMetricsCache.get(letterId) || null;
  }
  // Pulse transform-origin for a letter image: the combined letter+kamatz
  // ink center (not the baseline, not the box center) — same reasoning as
  // applyCharPulseOrigin above, so the pulse expands in place instead of
  // sweeping sideways.
  function applyLetterPulseOrigin(imgEl, letterId) {
    const set = (m) => {
      if (m) imgEl.style.transformOrigin = `${(m.cx / m.size) * 100}% ${((m.top + m.bottom) / 2 / m.size) * 100}%`;
    };
    const m = letterMetrics(letterId);
    if (m) set(m);
    else getLetterWindow(letterId).then(() => set(letterMetrics(letterId)));
  }

  // Pulls every image src a frame references, whatever shape that frame is —
  // including reading-pair's per-side slot specs (character/composite/
  // letter-image slots carry image srcs).
  function collectFrameSrcs(f) {
    const srcs = [].concat(f.img || [], f.imgs || []);
    if (f.kind === 'reading-pair' || f.kind === 'word-reveal') {
      [f.sa, f.ba].forEach((slot) => {
        if (!slot) return;
        if (slot.type === 'composite') srcs.push(slot.base, slot.overlay);
        else if (slot.type === 'character') srcs.push(slot.src);
        else if (slot.type === 'letter-image') {
          srcs.push(LETTERS[slot.letter].letterImg);
          // A silent companion letter (Aleph for Ba, He for Na) always
          // rides along with its host letter's letter-image — read
          // generically off the LETTERS data (see silentCompanion above)
          // so every chapter's letters round warms/preloads correctly.
          const companion = LETTERS[slot.letter] && LETTERS[slot.letter].silentCompanion;
          if (companion) srcs.push(LETTERS[companion].letterImg);
        }
      });
    }
    if (f.kind === 'sentence-reading') {
      // All 6 taught letters + all 3 silent companions used in the final
      // sentence row (see SENTENCE_LAYOUT, defined later near
      // buildSentenceStage — listed by id directly here rather than
      // referenced, since this function runs at page load, before that
      // later const has been evaluated), regardless of which one (if any)
      // is pulsing this particular frame — the geometry never changes
      // across a tap, so every glyph is always on screen.
      ['sa', 'ba', 'ka', 'na', 'pa', 'ra', 'aleph', 'he'].forEach((id) => srcs.push(LETTERS[id].letterImg));
    }
    return srcs.filter(Boolean);
  }
  function preloadAllImages(allFrames) {
    const seen = new Set();
    allFrames.forEach((f) => {
      collectFrameSrcs(f).forEach((src) => {
        if (src && !seen.has(src)) {
          seen.add(src);
          const preloadEl = new Image();
          preloadEl.onload = () => {
            imageDims.set(src, { w: preloadEl.naturalWidth, h: preloadEl.naturalHeight });
          };
          preloadEl.src = src;
        }
      });
    });
  }
  preloadAllImages(frames);
  // Warms readingWindowCache/croppedImageCache for every reading-pair slot
  // AT PAGE LOAD, before the person ever taps into that phase. Confirmed by
  // direct measurement: without this, the FIRST time a given crop is needed
  // each page load, its <img> genuinely sits blank (src="", naturalWidth=0)
  // for 40-60ms while the crop canvas work runs, THEN pops in fully formed —
  // a real, reproducible blank-then-pop, not a position bug. This makes that
  // one-time cost happen silently in the background at load, so every crop
  // is already sitting in cache before it's ever needed on screen.
  function precomputeReadingPairAssets(allFrames) {
    let sentenceWarmed = false;
    allFrames.forEach((f) => {
      if (f.kind === 'sentence-reading' && !sentenceWarmed) {
        // Same 8-id list as collectFrameSrcs above (and the same reason it's
        // spelled out here rather than reading SENTENCE_LAYOUT — that const
        // is declared later, near buildSentenceStage, after this runs).
        ['sa', 'ba', 'ka', 'na', 'pa', 'ra', 'aleph', 'he'].forEach((id) => getLetterWindow(id));
        sentenceWarmed = true;
      }
      if (f.kind !== 'reading-pair' && f.kind !== 'word-reveal') return;
      [f.sa, f.ba].forEach((spec) => {
        if (!spec) return;
        if (spec.type === 'composite') {
          getReadingCroppedImage(spec.letter, spec.base);
          getReadingCroppedImage(spec.letter, spec.overlay);
        } else if (spec.type === 'character') {
          getReadingCroppedImage(spec.letter, spec.src);
        } else if (spec.type === 'letter-image') {
          getLetterWindow(spec.letter);
          const companion = LETTERS[spec.letter] && LETTERS[spec.letter].silentCompanion;
          if (companion) getLetterWindow(companion);
        }
      });
    });
  }
  precomputeReadingPairAssets(frames);

  let index = 0;
  const contentEl = document.getElementById('content');
  const captionEl = document.getElementById('caption-text');
  const hudEl = document.getElementById('hud');
  const frameIdEl = document.getElementById('frame-id');

  // ---------------------------------------------------------------------
  // UI OVERLAY LAYER — #ui-overlay (see the "LOCKED DESIGN DECISION" CSS
  // comment). Lives outside #stage/#content entirely, so nothing here can
  // ever touch the teaching-phase frame system, and the teaching-phase
  // rect math can never be disturbed by anything added here. First (and
  // for now only) resident: a small confetti fountain for the saba-reveal
  // celebration. Self-contained canvas + requestAnimationFrame loop, no
  // external library — kept deliberately modest (one burst, ~70 pieces,
  // a couple of seconds), per Noam: "keeping it small, not too many
  // pyrotechnics."
  // ---------------------------------------------------------------------
  const confettiCanvas = document.getElementById('confetti-canvas');
  const confettiCtx = confettiCanvas.getContext && confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let confettiRafId = null;

  function resizeConfettiCanvas() {
    const dpr = window.devicePixelRatio || 1;
    confettiCanvas.width = Math.round(window.innerWidth * dpr);
    confettiCanvas.height = Math.round(window.innerHeight * dpr);
    if (confettiCtx) confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeConfettiCanvas);
  resizeConfettiCanvas();

  const CONFETTI_COLORS = ['#ff5a5f', '#ffb400', '#2ecc71', '#3498db', '#9b59b6', '#ff8fab'];

  // Fountain, not a wall — mostly-upward cone of velocities, real gravity,
  // fades out as each piece nears the end of its own lifespan. The
  // requestAnimationFrame loop below stops itself the instant every
  // particle has expired (filtered out, array empties, no reschedule) —
  // it can't run forever regardless of how burstConfetti gets called.
  function burstConfetti(originX, originY) {
    if (!confettiCtx) return;
    const count = 70;
    for (let i = 0; i < count; i++) {
      const angle = (-Math.PI / 2) + (Math.random() - 0.5) * (Math.PI * 0.9);
      const speed = 4 + Math.random() * 7;
      confettiParticles.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5 + Math.random() * 5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.3,
        life: 0,
        maxLife: 90 + Math.random() * 30,
      });
    }
    if (!confettiRafId) confettiRafId = requestAnimationFrame(stepConfetti);
  }

  function stepConfetti() {
    const gravity = 0.18;
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiParticles = confettiParticles.filter((p) => p.life < p.maxLife);
    confettiParticles.forEach((p) => {
      p.vy += gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;
      p.life += 1;
      confettiCtx.save();
      confettiCtx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rotation);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      confettiCtx.restore();
    });
    if (confettiParticles.length > 0) {
      confettiRafId = requestAnimationFrame(stepConfetti);
    } else {
      confettiRafId = null;
    }
  }

  function imgOrPlaceholder(src, extraClass) {
    if (!src) {
      const d = document.createElement('div');
      d.className = 'placeholder' + (extraClass ? ' ' + extraClass : '');
      d.textContent = '[image not set]';
      return d;
    }
    const img = document.createElement('img');
    if (extraClass) img.className = extraClass;
    img.src = src;
    img.alt = src;
    img.onerror = function () {
      const d = document.createElement('div');
      d.className = 'placeholder' + (extraClass ? ' ' + extraClass : '');
      d.textContent = `[missing: ${src}]`;
      img.replaceWith(d);
    };
    return img;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // How big the on-screen "scene" box gets, as a fraction of the available
